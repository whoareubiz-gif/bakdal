<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>박달브라운 테니스 클럽 - 모니터링</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;background:#000;}
.toast{position:fixed;bottom:2vw;left:50%;transform:translateX(-50%);background:rgba(20,20,20,.92);color:#fff;padding:0.8vw 1.6vw;border-radius:2vw;font-size:1.3vw;z-index:99999;max-width:88%;text-align:center;white-space:pre-line;}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:99998;padding:2vw;}

.modal-msg{font-size:1.6vw;font-weight:700;white-space:pre-line;margin-bottom:1.6vw;color:#1A1A1A;line-height:1.5;}
.modal-btns{display:flex;gap:0.8vw;justify-content:flex-end;}
.modal-btns button{padding:0.8vw 1.8vw;border-radius:0.8vw;border:none;font-size:1.4vw;font-weight:800;cursor:pointer;font-family:inherit;}
.modal-btn-gray{background:#EDECE8;color:#555;}
.modal-btn-primary{background:#1D9E75;color:#fff;}
</style>
</head>
<body>
<div id="board-overlay" style="display:flex;position:fixed;inset:0;background:#EFEDE8;z-index:500;flex-direction:column;overflow:hidden;">
  <div data-board-hdr style="display:flex;align-items:center;justify-content:space-between;padding:0.4vw 1.5vw;background:#1D9E75;position:sticky;top:0;z-index:10;flex-wrap:wrap;gap:4px">
    <div style="color:#fff;font-size:1.7vw;font-weight:900;letter-spacing:-0.02em;white-space:nowrap">박달브라운 테니스 클럽 - 코트 현황</div>
    <div style="display:flex;align-items:center;gap:1.2vw">
      <button onclick="showReservationImageModal()" style="background:rgba(255,255,255,.25);color:#fff;border:none;border-radius:8px;padding:0.4vw 1vw;font-size:1.2vw;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap">예약표</button>
      <div id="board-clock" style="color:#fff;font-size:1.8vw;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap"></div>
      <div id="board-sync-dot" style="width:14px;height:14px;border-radius:50%;background:#aaa;flex-shrink:0" title="Firebase 연결상태"></div>
      <button id="theme-btn" onclick="cycleTheme()" style="background:rgba(255,255,255,.25);color:#fff;border:none;border-radius:8px;padding:0.4vw 1vw;font-size:1.2vw;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap">야외밝음</button>
      <button onclick="closeMonitorBoard()" style="background:rgba(255,255,255,.25);color:#fff;border:none;border-radius:8px;padding:0.6vw 1.2vw;font-size:1.4vw;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap">닫기</button>
    </div>
  </div>
  <div id="board-content" style="padding:0.7vw 1.2vw 1vw 1.2vw;box-sizing:border-box;flex:1;overflow-y:auto;overflow-x:hidden;background:#EFEDE8;"></div>
</div>
<div id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   Firebase 설정 - index3.html과 완전히 동일(t3/ 이하 경로 공유, 읽고 쓰는 방식도 동일).
   ══════════════════════════════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyD_anBSKfX8UsExUOQoDilhMJtDe8eoVks",
  authDomain: "bakdal-d30e6.firebaseapp.com",
  databaseURL: "https://bakdal-d30e6-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bakdal-d30e6",
  storageBucket: "bakdal-d30e6.firebasestorage.app",
  messagingSenderId: "250451058346",
  appId: "1:250451058346:web:d1635d423763fba63cbad3",
  measurementId: "G-EEGPXMBXKL"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const BASE = db.ref('t3');
const ATTEND_REF = BASE.child('attend');
const COURT_REF  = BASE.child('court');
const NEXT_REF   = BASE.child('next');
const GAMES_REF  = BASE.child('games');
const LEFT_REF   = BASE.child('left');
const META_REF   = BASE.child('meta');
const MEMBERS_REF = BASE.child('members');
const RESIMG_REF = db.ref('tennis_reservation_image');
const COMBO_HISTORY_REF = BASE.child('comboHistory'); // /t3/comboHistory/{정렬된 id csv} = true - 오늘 이미 확정되어 같이 뛴 4인 조합 기록(index3.html과 공유)
const CMAX=4;
const SLOTS=['m1','m2','m3','m4'];

// appMode='admin'으로 고정: 로그인 절차 없이 바로 모니터링을 시작하는 화면이라, 로스터에서
// 이름을 탭해서 바로 출석/퇴소시키는 정도의 조작만 허용한다(코트 확정/해제 등은 이 화면엔 없음).
const appMode='admin';

let MEMBERS=[]; // 최초 로드 전까지는 비어있다가 MEMBERS_REF에서 즉시 채워짐(index3.html이 이미 심어둔 값 그대로 공유)
let attendMap={}, courtMap={1:null,2:null,3:null,4:null}, nextMap={1:null,2:null}, gamesMap={}, leftList=[];
let courtActive={1:true,2:true,3:true,4:true};
let reservationImageInfo=null;
let readyFlags={attend:false,court:false,next:false,games:false,left:false,meta:false,members:false};
let comboHistorySet={}; // {정렬된 id csv:true} - 오늘 이미 확정되어 같이 뛴 조합들(추천팀 중복 방지, index3.html과 공유)
let courtFlashUntil={}; // 지금 monitor3에서는 시각 효과 없이 재렌더 트리거용으로만 씀
function allReady(){ return Object.values(readyFlags).every(Boolean); }

function nowTs(){ return Math.floor(Date.now()/1000); }
function timeStr(){ const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function todayLbl(){ const d=new Date(); return `${d.getMonth()+1}/${d.getDate()}`; }
function nameOf(id){ const a=attendMap[id]; if(a) return a.name; const m=MEMBERS.find(x=>x.id===id); return m?m.name:('id'+id); }
function genderOf(id){ const a=attendMap[id]; if(a) return a.gender; const m=MEMBERS.find(x=>x.id===id); return m?m.gender:'m'; }
function courtMembers(rec){ return rec ? SLOTS.map(k=>rec[k]).filter(Boolean) : []; }
function isConfirmed(rec){ return !!(rec && rec.confirm && rec.confirm.committedGen===rec.gen); }
function CNAME(n){ return n+'코트'; }
function isGuestAttendee(a){ return !!(a && a.isGuest); }

let toastTimer=null;
function toast(msg,ms){
  const old=document.getElementById('toastEl'); if(old) old.remove();
  const el=document.createElement('div'); el.id='toastEl'; el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.remove(), ms||2200);
}

/* ══════════════════════════════════════════════════════════════════════════
   출석/퇴소 - 로스터 이름을 탭했을 때만 쓴다(index3.html과 동일한 로직 그대로 재사용).
   ══════════════════════════════════════════════════════════════════════════ */
function removeFromAnyCourtOrNext(memberId, cb){
  const jobs=[];
  [1,2,3,4].forEach(n=>jobs.push(new Promise(res=>{
    COURT_REF.child(n).transaction(cur=>{
      if(!cur) return cur;
      let changed=false;
      SLOTS.forEach(k=>{ if(cur[k]===memberId){ cur[k]=null; changed=true; } });
      if(changed) cur.gen=(cur.gen||0)+1;
      return cur;
    }, ()=>res());
  })));
  [1,2].forEach(n=>jobs.push(new Promise(res=>{
    NEXT_REF.child(n).transaction(cur=>{
      if(!cur) return cur;
      let changed=false;
      SLOTS.forEach(k=>{ if(cur[k]===memberId){ cur[k]=null; changed=true; } });
      if(changed) cur.gen=(cur.gen||0)+1;
      return cur;
    }, ()=>res());
  })));
  Promise.all(jobs).then(()=>cb&&cb());
}
function doAttend(memberId){
  if(attendMap[memberId]){ toast('이미 출석중입니다'); return; }
  const m=MEMBERS.find(x=>x.id===memberId); if(!m) return;
  const t=timeStr(), ts=nowTs();
  ATTEND_REF.child(memberId).set({
    name:m.name, gender:m.gender, attendTs:ts, time:t, isGuest:false,
    leavingScheduled:false, leavingScheduledAt:null, courtFreeAt:t, courtFreeTs:ts,
  });
  GAMES_REF.child(memberId).set(0);
  // 같은 날 이전에 퇴소했다가 다시 출석하는 경우, 예전 퇴소기록이 중복으로 남지 않게 지운다(index3.html과 동일).
  leftList.filter(x=>x.id===memberId).forEach(x=> LEFT_REF.child(x.key).remove() );
}
function doLeave(memberId){
  const a=attendMap[memberId]; if(!a) return;
  removeFromAnyCourtOrNext(memberId, ()=>{
    const games=gamesMap[memberId]||0;
    const leftT=timeStr(), leftTs=nowTs();
    LEFT_REF.child(memberId+'_'+a.attendTs).set({
      id:memberId, name:a.name, gender:a.gender, games, time:a.time,
      leftAt:leftT, leftTs, attendTs:a.attendTs, isGuest:!!a.isGuest,
    });
    ATTEND_REF.child(memberId).remove();
    GAMES_REF.child(memberId).remove();
  });
}
// 1분 지난 꽉 찬 1~4코트를 자동확정 (index3.html과 동일 로직 - 여러 기기가 동시에 열려있어도
// Firebase 트랜잭션이 정확히 한 번만 반영되게 해준다)
function checkAutoConfirm(){
  [1,2,3,4].forEach(n=>{
    const rec=courtMap[n];
    if(!rec || isConfirmed(rec)) return;
    const ids=courtMembers(rec);
    if(ids.length!==CMAX) return;
    if(!rec.filledAt || Date.now()-rec.filledAt < 60000) return;
    COURT_REF.child(n).transaction(cur=>{
      if(!cur) return;
      const curIds=SLOTS.map(k=>cur[k]).filter(Boolean);
      if(curIds.length!==CMAX) return;
      const idsKey=curIds.slice().sort((a,b)=>a-b).join(',');
      if(cur.confirm && cur.confirm.committedGen===cur.gen) return;
      cur.confirm={ids:idsKey, committedGen:cur.gen, confirmedAt:Date.now()};
      return cur;
    }, (err,committed,snap)=>{
      if(err||!committed) return;
      const v=snap.val();
      if(v && v.confirm && v.confirm.committedGen===v.gen && v.confirm.confirmedAt && (Date.now()-v.confirm.confirmedAt)<3000){
        const ids2=v.confirm.ids.split(',').map(Number);
        ids2.forEach(id=>GAMES_REF.child(id).transaction(g=>(g||0)+1));
        COMBO_HISTORY_REF.child(v.confirm.ids).set(true); // 오늘 이 4명이 같이 뛰었다는 걸 기록(추천팀 중복 방지용, index3.html과 공유)
      }
    });
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   코트 배정/해제/확정 + 다음차례 편성 - index3.html과 완전히 동일한 로직을 그대로 가져옴.
   회원들이 모니터링 화면에서도 직접 눌러서 게임을 편성할 수 있게 하기 위함.
   ══════════════════════════════════════════════════════════════════════════ */
function toggleCourtActive(n){
  const isOn = courtActive[n];
  if(isOn){
    const rec = courtMap[n];
    const cnt = courtMembers(rec).length;
    if(cnt>0){ toast(`${n}코트에 배정된 인원이 있어 비활성화할 수 없습니다\n(먼저 게임끝을 눌러주세요)`); return; }
  }
  META_REF.child('courtActive').child(n).transaction(cur=>!cur);
}
function openModal(msg, onOk, okText){
  const old=document.getElementById('modalOv'); if(old) old.remove();
  const ov=document.createElement('div'); ov.id='modalOv'; ov.className='modal-ov';
  ov.innerHTML=`<div class="modal-box"><div class="modal-msg">${msg}</div><div class="modal-btns">
    <button class="modal-btn-gray" onclick="document.getElementById('modalOv').remove()">취소</button>
    <button class="modal-btn-primary" id="modalOkBtn">${okText||'확인'}</button>
  </div></div>`;
  document.body.appendChild(ov);
  document.getElementById('modalOkBtn').onclick=()=>{ ov.remove(); onOk&&onOk(); };
  ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
}
// 이 사람이 지금 어디 배정되어 있는지: {type:'court'|'next', n} 또는 배정 안 됐으면 null
function currentAssignmentOf(id){
  for(let n=1;n<=4;n++){ if(courtMap[n] && courtMembers(courtMap[n]).includes(id)) return {type:'court', n}; }
  for(let n=1;n<=2;n++){ if(nextMap[n] && courtMembers(nextMap[n]).includes(id)) return {type:'next', n}; }
  return null;
}
function whereIsMember(id){
  for(let n=1;n<=4;n++){ if(courtMap[n] && courtMembers(courtMap[n]).includes(id)) return CNAME(n); }
  for(let n=1;n<=2;n++){ if(nextMap[n] && courtMembers(nextMap[n]).includes(id)) return '다음'+n; }
  return '대기중';
}
function flashCourtCard(dropKey){
  courtFlashUntil[dropKey]=Date.now()+900;
  renderBoard();
  setTimeout(()=>{ delete courtFlashUntil[dropKey]; renderBoard(); }, 950);
}
function assignToCourt(memberId, n, isNext){
  if(!isNext && !courtActive[n]){ toast('비활성화된 코트입니다'); return; }
  const a=attendMap[memberId]; if(!a){ toast('출석 정보가 없습니다'); return; }
  const cur=currentAssignmentOf(memberId);
  if(cur && ((isNext && cur.type==='next' && cur.n===n) || (!isNext && cur.type==='court' && cur.n===n))){
    removeFromAnyCourtOrNext(memberId, ()=>{ toast(`${a.name}님 배정을 취소했습니다`); });
    return;
  }
  if(a.leavingScheduled){ toast('퇴소예정 회원은 배정할 수 없습니다'); return; }
  removeFromAnyCourtOrNext(memberId, ()=>{
    const ref = isNext ? NEXT_REF.child(n) : COURT_REF.child(n);
    ref.transaction(cur=>{
      cur = cur || {m1:null,m2:null,m3:null,m4:null,gen:0};
      if(SLOTS.some(k=>cur[k]===memberId)) return cur;
      const slot = SLOTS.find(k=>!cur[k]);
      if(!slot) return;
      cur[slot]=memberId;
      const cnt = SLOTS.filter(k=>cur[k]).length;
      cur.gen = (cur.gen||0)+1;
      if(cnt===CMAX) cur.filledAt = Date.now();
      return cur;
    }, (err,committed)=>{
      if(err || !committed){ toast('배정할 자리가 없습니다'); return; }
      flashCourtCard(isNext?'n'+n:n);
    });
  });
}
function reserveNextFromGame(memberId, n){
  const ref = NEXT_REF.child(n);
  const alreadyThere = nextMap[n] && courtMembers(nextMap[n]).includes(memberId);
  if(alreadyThere){
    ref.transaction(cur=>{
      if(!cur) return cur;
      SLOTS.forEach(k=>{ if(cur[k]===memberId) cur[k]=null; });
      cur.gen=(cur.gen||0)+1;
      return cur;
    }, (err,committed)=>{
      if(err||!committed) return;
      toast(`${nameOf(memberId)}님의 다음차례${n} 예약을 취소했습니다`);
    });
    return;
  }
  ref.transaction(cur=>{
    cur = cur || {m1:null,m2:null,m3:null,m4:null,gen:0};
    if(SLOTS.some(k=>cur[k]===memberId)) return cur;
    const slot = SLOTS.find(k=>!cur[k]);
    if(!slot) return;
    cur[slot]=memberId;
    const cnt = SLOTS.filter(k=>cur[k]).length;
    cur.gen = (cur.gen||0)+1;
    if(cnt===CMAX) cur.filledAt = Date.now();
    return cur;
  }, (err,committed)=>{
    if(err || !committed){ toast('예약할 자리가 없습니다'); return; }
    flashCourtCard('n'+n);
    toast(`${nameOf(memberId)}님을 다음차례${n}로 예약했습니다`);
  });
}
// "게임끝" 버튼: index3.html의 코트 카드 상단 "해제" 버튼과 완전히 동일. 대기시간 리셋은
// 확정된(=실제로 게임을 한) 코트를 해제할 때만 적용된다.
function clearCourt(n, isNext){
  const ref = isNext?NEXT_REF.child(n):COURT_REF.child(n);
  const rec = isNext?nextMap[n]:courtMap[n];
  const wasConfirmed = !isNext && isConfirmed(rec);
  const memberIds = rec ? SLOTS.map(k=>rec[k]).filter(Boolean) : [];
  ref.set({m1:null,m2:null,m3:null,m4:null,gen:Date.now()});
  if(wasConfirmed && memberIds.length){
    const t=timeStr(), ts=nowTs();
    memberIds.forEach(id=> ATTEND_REF.child(id).update({courtFreeAt:t, courtFreeTs:ts}) );
  }
}
/* ── 추천팀 선정 로직 (index3.html과 완전히 동일) ── */
function getWaitingIds(){
  return Object.keys(attendMap).map(Number)
    .filter(id=>{
      const a=attendMap[id];
      if(a.leavingScheduled) return false;
      for(let n=1;n<=4;n++){ if(courtMap[n] && isConfirmed(courtMap[n]) && courtMembers(courtMap[n]).includes(id)) return false; }
      return true;
    })
    .sort((a,b)=>(attendMap[a].courtFreeTs||attendMap[a].attendTs||0)-(attendMap[b].courtFreeTs||attendMap[b].attendTs||0));
}
function getFreeIds(){
  return getWaitingIds().filter(id=>!currentAssignmentOf(id));
}
function comboKey(ids){ return ids.slice().sort((a,b)=>a-b).join(','); }
function pickTeamAvoidingRepeat(pool, count){
  let picked = pool.slice(0, count);
  let poolIdx = count;
  let attempts = 0;
  while(picked.length===4 && comboHistorySet[comboKey(picked)] && poolIdx<pool.length && attempts<10){
    let latestIdx=0, latestTs=-Infinity;
    picked.forEach((id,i)=>{
      const ts = attendMap[id] ? (attendMap[id].attendTs||-Infinity) : -Infinity;
      if(ts>latestTs){ latestTs=ts; latestIdx=i; }
    });
    picked[latestIdx]=pool[poolIdx];
    poolIdx++;
    attempts++;
  }
  return picked;
}
function pickMixedGenderCounts(mAvailable, fAvailable){
  let mCount=Math.min(2, mAvailable);
  let fCount=Math.min(2, fAvailable);
  let total=mCount+fCount;
  if(total<4){
    let need=4-total;
    const extraM=Math.min(need, mAvailable-mCount);
    mCount+=extraM; need-=extraM;
    const extraF=Math.min(need, fAvailable-fCount);
    fCount+=extraF;
  }
  return {mCount, fCount};
}
function pickMixedTeamAvoidingRepeat(mPool, fPool){
  const {mCount, fCount} = pickMixedGenderCounts(mPool.length, fPool.length);
  let mPicked = mPool.slice(0, mCount);
  let fPicked = fPool.slice(0, fCount);
  let mIdx=mCount, fIdx=fCount, attempts=0;
  while((mPicked.length+fPicked.length)===4 && comboHistorySet[comboKey(mPicked.concat(fPicked))] && attempts<10){
    const combined = mPicked.map(id=>({id,g:'m'})).concat(fPicked.map(id=>({id,g:'f'})));
    let idx=0, latestTs=-Infinity;
    combined.forEach((o,i)=>{ const ts=attendMap[o.id]?(attendMap[o.id].attendTs||-Infinity):-Infinity; if(ts>latestTs){ latestTs=ts; idx=i; } });
    const target=combined[idx];
    if(target.g==='m' && mIdx<mPool.length){ mPicked[mPicked.indexOf(target.id)]=mPool[mIdx]; mIdx++; }
    else if(target.g==='f' && fIdx<fPool.length){ fPicked[fPicked.indexOf(target.id)]=fPool[fIdx]; fIdx++; }
    else break;
    attempts++;
  }
  return mPicked.concat(fPicked);
}
function findGenderCandidateAnywhere(gender, excludeIds){
  const courts=getConfirmedCourtsByElapsed();
  for(const c of courts){
    const cand=c.ids.find(id=>genderOf(id)===gender && !excludeIds.includes(id));
    if(cand) return cand;
  }
  for(let n=1;n<=2;n++){
    const ids=courtMembers(nextMap[n]);
    const cand=ids.find(id=>genderOf(id)===gender && !excludeIds.includes(id));
    if(cand) return cand;
  }
  return null;
}
function ensureMixedGenderAnywhere(picked, mFreeCount, fFreeCount){
  const hasM=picked.some(id=>genderOf(id)==='m');
  const hasF=picked.some(id=>genderOf(id)==='f');
  if(hasM && hasF) return picked;
  if(picked.length<4) return picked;
  const missing = hasM ? 'f' : 'm';
  if(missing==='f' && fFreeCount>0) return picked;
  if(missing==='m' && mFreeCount>0) return picked;
  const candidate = findGenderCandidateAnywhere(missing, picked);
  if(!candidate) return picked;
  let idx=0, latestTs=-Infinity;
  picked.forEach((id,i)=>{
    const ts = attendMap[id] ? (attendMap[id].attendTs||-Infinity) : -Infinity;
    if(ts>latestTs){ latestTs=ts; idx=i; }
  });
  const result=picked.slice();
  result[idx]=candidate;
  return result;
}
function getConfirmedCourtsByElapsed(){
  const list=[];
  [1,2,3,4].forEach(n=>{
    const rec=courtMap[n];
    if(rec && isConfirmed(rec)){
      list.push({n, ids: courtMembers(rec), confirmedAt: (rec.confirm&&rec.confirm.confirmedAt)||0});
    }
  });
  return list.sort((a,b)=>a.confirmedAt-b.confirmedAt);
}
function borrowFromConfirmedCourts(needed, genderFilter){
  const courts=getConfirmedCourtsByElapsed();
  if(!courts.length || needed<=0) return [];
  const result=[]; const used=new Set();
  let i=0;
  while(i<courts.length && result.length<needed){
    const baseTs=courts[i].confirmedAt;
    const group=[]; let j=i;
    while(j<courts.length && courts[j].confirmedAt-baseTs<=5*60*1000){ group.push(courts[j]); j++; }
    let candidates=[];
    group.forEach(c=>{ candidates.push(...c.ids); });
    candidates=candidates.filter(id=>!used.has(id) && (!genderFilter || genderOf(id)===genderFilter));
    candidates.sort((a,b)=>(attendMap[a]?(attendMap[a].attendTs||0):0)-(attendMap[b]?(attendMap[b].attendTs||0):0));
    for(const id of candidates){
      if(result.length>=needed) break;
      result.push(id); used.add(id);
    }
    i=j;
  }
  return result;
}
function assignTeamToCourt(ids, n, isNext){
  let i=0;
  function next(){
    if(i>=ids.length) return;
    const id=ids[i++];
    assignToCourt(id,n,isNext);
    setTimeout(next,120);
  }
  next();
}
function checkAndAssignTeam(ids, n, isNext){
  const busy = ids.filter(id=>{
    const loc = whereIsMember(id);
    if(isNext) return loc.startsWith('다음');
    return loc.endsWith('코트') || loc.startsWith('다음');
  });
  if(busy.length){
    const names = busy.map(id=>`${nameOf(id)}(${whereIsMember(id)})`).join(', ');
    openModal(`⚠️ 다음 인원이 이미 다른 곳에 배정되어 있어 배정할 수 없습니다.\n${names}\n\n먼저 해당 인원을 해제한 뒤 다시 시도해주세요.`, null, '확인');
    return;
  }
  assignTeamToCourt(ids, n, isNext);
}
function assignRecommendedTeamToNext(ids, n){
  let i=0;
  function next(){
    if(i>=ids.length) return;
    const id=ids[i++];
    const cur=currentAssignmentOf(id);
    if(cur && cur.type==='court' && isConfirmed(courtMap[cur.n])){
      reserveNextFromGame(id, n);
    } else {
      assignToCourt(id, n, true);
    }
    setTimeout(next, 120);
  }
  next();
}
// "남자만/여자만/혼성" 버튼: index3.html의 추천팀 로직 그대로 계산해서, 그 결과를 곧바로
// 다음차례N에 편성한다(추천 카드 없이 바로 실행).
// 이미 그 자리에 인원이 채워져 있어도(예: 방금 "남자만"을 눌러서 4명이 찬 상태) 계속
// "여자만"/"혼성"을 눌러서 다시 편성할 수 있어야 하므로, 기존 인원이 있으면 먼저 비우고
// (그 인원들은 다시 대기자로 돌아감) 그다음에 새로 계산한 팀을 채운다.
function formGenderTeamToNext(n, kind){
  const existing = courtMembers(nextMap[n]);
  if(existing.length){
    NEXT_REF.child(n).set({m1:null,m2:null,m3:null,m4:null,gen:Date.now()});
    setTimeout(()=>doFormGenderTeamToNext(n, kind), 400); // 비우는 게 실제로 반영될 시간을 준 뒤 새로 채운다
  } else {
    doFormGenderTeamToNext(n, kind);
  }
}
function doFormGenderTeamToNext(n, kind){
  const freeIds=getFreeIds();
  const mFree=freeIds.filter(id=>genderOf(id)==='m');
  const fFree=freeIds.filter(id=>genderOf(id)==='f');
  let picked;
  if(kind==='mix'){
    picked=pickMixedTeamAvoidingRepeat(mFree,fFree);
    if(picked.length<4){
      const need=4-picked.length;
      const borrowed=borrowFromConfirmedCourts(need,null).filter(id=>!picked.includes(id));
      picked=picked.concat(borrowed);
    }
    picked=ensureMixedGenderAnywhere(picked, mFree.length, fFree.length);
  } else {
    const pool = kind==='m'?mFree:fFree;
    picked=pickTeamAvoidingRepeat(pool, Math.min(4,pool.length));
    if(picked.length<4){
      const need=4-picked.length;
      const borrowed=borrowFromConfirmedCourts(need, kind).filter(id=>!picked.includes(id));
      picked=picked.concat(borrowed);
    }
  }
  if(!picked.length){ toast('추천할 인원이 없습니다'); return; }
  const hasBorrowed = picked.some(id=>!freeIds.includes(id));
  if(hasBorrowed) assignRecommendedTeamToNext(picked, n);
  else checkAndAssignTeam(picked, n, true);
}
// 다음차례1,2 전용 "빈코트에 편성하기": 4명을 실제 빈 코트로 옮긴다(index3.html과 동일).
function confirmNextCourt(n){
  const rec = nextMap[n];
  const ids = courtMembers(rec);
  if(ids.length!==CMAX){ toast('4명이 채워져야 편성할 수 있습니다'); return; }
  // 이 4명 중 아직 다른 코트에서 확정되어 게임 중인 사람이 있으면, 그 코트를 강제로 깨뜨리지
  // 않기 위해 편성 자체를 막는다(index3.html과 동일한 안전장치).
  const stillPlaying = ids.filter(id=>{
    const cur=currentAssignmentOf(id);
    return cur && cur.type==='court' && isConfirmed(courtMap[cur.n]);
  });
  if(stillPlaying.length){
    const names = stillPlaying.map(id=>`${nameOf(id)}(${currentAssignmentOf(id).n}코트)`).join(', ');
    openModal(`⚠️ 다음 인원이 아직 다른 코트에서 게임 중이라 편성할 수 없습니다.\n${names}\n\n해당 게임이 끝난 뒤 다시 시도해주세요.`, null, '확인');
    return;
  }
  const emptyCourt = [1,2,3,4].find(cn=>courtActive[cn] && courtMembers(courtMap[cn]).length===0);
  if(!emptyCourt){
    openModal('⚠️ 배정 가능한 빈 코트가 없습니다.\n코트가 빌 때까지 기다려주세요.', null, '확인');
    return;
  }
  let i=0;
  function next(){
    if(i>=ids.length){
      if(n===1) setTimeout(shiftNext2ToNext1, 1200);
      return;
    }
    const id=ids[i++];
    assignToCourt(id, emptyCourt, false);
    setTimeout(next,120);
  }
  next();
}
function shiftNext2ToNext1(){
  const ids2 = courtMembers(nextMap[2]);
  if(!ids2.length) return;
  let j=0;
  function moveNext(){
    if(j>=ids2.length) return;
    const id=ids2[j++];
    moveNextSlotPreservingGame(id, 2, 1);
    setTimeout(moveNext,120);
  }
  moveNext();
}
function moveNextSlotPreservingGame(memberId, fromN, toN){
  const cur = currentAssignmentOf(memberId);
  const stillPlaying = cur && cur.type==='court' && isConfirmed(courtMap[cur.n]);
  if(!stillPlaying){
    assignToCourt(memberId, toN, true);
    return;
  }
  NEXT_REF.child(fromN).transaction(c=>{
    if(!c) return c;
    SLOTS.forEach(k=>{ if(c[k]===memberId) c[k]=null; });
    c.gen=(c.gen||0)+1;
    return c;
  }, ()=>{
    NEXT_REF.child(toN).transaction(c=>{
      c = c || {m1:null,m2:null,m3:null,m4:null,gen:0};
      if(SLOTS.some(k=>c[k]===memberId)) return c;
      const slot=SLOTS.find(k=>!c[k]);
      if(!slot) return;
      c[slot]=memberId;
      const cnt=SLOTS.filter(k=>c[k]).length;
      c.gen=(c.gen||0)+1;
      if(cnt===CMAX) c.filledAt=Date.now();
      return c;
    });
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   음성 안내 (index3.html과 동일) - 출석/퇴소/코트배정/코트확정 시 자동으로 읽어준다.
   ══════════════════════════════════════════════════════════════════════════ */
let speechUnlocked=false;
function unlockSpeechSynthesis(){
  if(speechUnlocked) return;
  try{
    if(!('speechSynthesis' in window)) return;
    const u=new SpeechSynthesisUtterance(' ');
    u.volume=0; u.lang='ko-KR';
    window.speechSynthesis.speak(u);
    speechUnlocked=true;
  }catch(e){}
}
const notifyQueue=[];
let notifyQueueRunning=false;
function speakStatus(text){
  notifyQueue.push(text);
  runNotifyQueue();
}
// 모바일 크롬은 cancel() 직후 곧바로 speak()를 부르면 새 발화가 그냥 조용히 씹히는(먹통이
// 되는) 유명한 버그가 있다. 그래서: (1) 지금 아무것도 말하고 있지 않으면 cancel() 없이
// 바로 speak(), (2) 말하고 있는 중이면 cancel() 후 약간 텀을 두고 speak(), (3) 그래도
// 일정 시간 안에 실제로 시작 안 했으면 한 번 더 시도한다.
function runNotifyQueue(){
  if(notifyQueueRunning) return;
  const next=notifyQueue.shift();
  if(!next) return;
  notifyQueueRunning=true;
  const done=()=>{ notifyQueueRunning=false; runNotifyQueue(); };
  try{
    if(!('speechSynthesis' in window)){ setTimeout(done,3000); return; }
    const speakNow=()=>{
      const utter=new SpeechSynthesisUtterance(next);
      utter.lang='ko-KR'; utter.rate=1.15; utter.pitch=1.0;
      try{
        const voices=window.speechSynthesis.getVoices();
        const koVoice=voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('ko'));
        if(koVoice) utter.voice=koVoice;
      }catch(e){}
      let started=false, fired=false;
      const safeDone=()=>{ if(fired)return; fired=true; done(); };
      utter.onstart=()=>{ started=true; };
      utter.onend=safeDone; utter.onerror=safeDone;
      try{ window.speechSynthesis.speak(utter); }catch(e){ safeDone(); return; }
      // 크롬 버그로 발화가 씹혔는지 확인 - 300ms 안에 실제로 시작 안 했으면 한 번 더 시도
      setTimeout(()=>{
        if(!started && !fired){
          try{ window.speechSynthesis.cancel(); window.speechSynthesis.speak(utter); }catch(e){}
        }
      }, 300);
      setTimeout(()=>{ if(!fired) safeDone(); }, 8000); // 그래도 안 되면 포기하고 다음 안내로 넘어감
    };
    if(window.speechSynthesis.speaking || window.speechSynthesis.pending){
      try{ window.speechSynthesis.cancel(); }catch(e){}
      setTimeout(speakNow, 120);
    } else {
      speakNow();
    }
  }catch(e){ done(); }
}
setInterval(()=>{ if(window.speechSynthesis && !notifyQueueRunning) window.speechSynthesis.resume(); }, 14000);

let prevAttendIds=null, prevLeftIds=null;
function checkAttendanceAnnouncements(){
  if(!allReady()) return;
  const curAttendIds=new Set(Object.keys(attendMap).map(Number));
  const curLeftIds=new Set(leftList.map(x=>x.key));
  if(prevAttendIds!==null){
    curAttendIds.forEach(id=>{ if(!prevAttendIds.has(id)){ const a=attendMap[id]; if(a) speakStatus(`${a.name} 회원님 출석하였습니다`); } });
  }
  if(prevLeftIds!==null){
    curLeftIds.forEach(key=>{ if(!prevLeftIds.has(key)){ const a=leftList.find(x=>x.key===key); if(a) speakStatus(`${a.name} 회원님 퇴소하였습니다`); } });
  }
  prevAttendIds=curAttendIds; prevLeftIds=curLeftIds;
}
let prevCourtSnapshot={};
function checkGlobalCourtAnnouncements(){
  if(!allReady()){
    [1,2,3,4].forEach(n=>{ const rec=courtMap[n]; prevCourtSnapshot['c'+n]={cnt:courtMembers(rec).length, confirmed:isConfirmed(rec), key:courtMembers(rec).sort((a,b)=>a-b).join(',')}; });
    [1,2].forEach(n=>{ const rec=nextMap[n]; prevCourtSnapshot['n'+n]={cnt:courtMembers(rec).length, key:courtMembers(rec).sort((a,b)=>a-b).join(',')}; });
    return;
  }
  [1,2,3,4].forEach(n=>{
    const rec=courtMap[n];
    const ids=courtMembers(rec);
    const cnt=ids.length, confirmed=isConfirmed(rec);
    const key=ids.slice().sort((a,b)=>a-b).join(',');
    const prev=prevCourtSnapshot['c'+n];
    if(prev){
      if(cnt===CMAX && !confirmed && (prev.key!==key || prev.cnt<CMAX)){
        speakStatus(`${CNAME(n)}에 ${ids.map(id=>nameOf(id)).join(', ')} 배정되었습니다`);
      }
      if(confirmed && !prev.confirmed){
        speakStatus(`${CNAME(n)}에 ${ids.map(id=>nameOf(id)).join(', ')} 확정되어 입장하십시오`);
      }
    }
    prevCourtSnapshot['c'+n]={cnt, confirmed, key};
  });
  [1,2].forEach(n=>{
    const rec=nextMap[n];
    const ids=courtMembers(rec);
    const cnt=ids.length;
    const key=ids.slice().sort((a,b)=>a-b).join(',');
    const prev=prevCourtSnapshot['n'+n];
    if(prev){
      if(cnt===CMAX && (prev.key!==key || prev.cnt<CMAX)){
        speakStatus(`다음차례${n}에 ${ids.map(id=>nameOf(id)).join(', ')} 배정되었습니다`);
      }
    }
    prevCourtSnapshot['n'+n]={cnt, key};
  });
}

  RESIMG_REF.on('value', snap=>{ reservationImageInfo=snap.val(); });

  firebase.database().ref('.info/connected').on('value', snap=>{

    const games = (id!=null && gamesMap[id]!=null) ? gamesMap[id] : 0;
    return`<div style="background:${slotBg};border-radius:1vw;padding:0.4vw 1.0vw;margin-bottom:0.3vw;display:flex;align-items:center;gap:0.6vw;">
      <span style="font-size:3.0vw;font-weight:900;color:${nameTc};letter-spacing:-0.02em">${a.name}${guestTagBoard(a)}</span>
      <span style="font-size:1.3vw;font-weight:700;color:${genderTc};background:${genderBg};padding:0.2vw 0.7vw;border-radius:0.5vw;white-space:nowrap;flex-shrink:0">${a.gender==='m'?'남':'여'}</span>
      <span style="font-size:1.3vw;font-weight:700;color:#1A1A1A;white-space:nowrap;flex-shrink:0">${games}게임</span>
    </div>`;
  }
  function emptySlot(conf){
    const ec = conf ? "rgba(255,255,255,1)" : "rgba(0,0,0,.7)";
    const eb = conf ? "rgba(255,255,255,.7)" : "rgba(0,0,0,.35)";
    return`<div style="border:0.15vw dashed ${eb};border-radius:1vw;padding:0.6vw 1.0vw;margin-bottom:0.4vw;text-align:center;color:${ec};font-size:1.6vw;font-weight:700">- 빈자리 -</div>`;
  }
  function bigCard(n, isNext){
    if(!isNext && !courtActive[n]){
      return`<div style="background:#C8CDD2;border-radius:1.4vw;padding:2.5vw 1.5vw;min-width:0;height:100%;box-sizing:border-box;box-shadow:0 0.4vw 1.2vw rgba(0,0,0,.1);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:.6">
        <div onclick="toggleCourtActive(${n})" style="color:#fff;font-size:2.6vw;font-weight:900;margin-bottom:0.5vw;cursor:pointer;text-decoration:underline">${CNAME(n)}</div>
        <div style="color:rgba(255,255,255,.8);font-size:1.6vw;font-weight:700">오늘 사용 안 함 (눌러서 켜기)</div>
      </div>`;
    }
    const rec = isNext ? nextMap[n] : courtMap[n];
    const ids = courtMembers(rec);
    const cnt = ids.length;
    const conf = isNext ? false : isConfirmed(rec);
    let body='';
    if(isNext){
      const slots=[];
      ids.forEach(id=>{
        const a=attendMap[id]||{name:nameOf(id),gender:genderOf(id)};
        const nameTc='#1A1A1A';
        const _isG=isGuestAttendee(a);
        slots.push(`<div style="flex:1;text-align:center;background:rgba(255,255,255,0.78);border-radius:0.8vw;padding:0.2vw 0.5vw;font-size:3.0vw;font-weight:900;color:${nameTc};letter-spacing:${_isG?'-0.08em':'-0.02em'};white-space:nowrap;overflow:hidden">${a.name}${guestTagBoard(a,true)}</div>`);
      });
      for(let i=cnt;i<CMAX;i++){
        slots.push(`<div style="flex:1;text-align:center;border:0.15vw dashed rgba(0,0,0,.15);border-radius:0.8vw;padding:0.9vw 0.5vw;font-size:1.4vw;color:rgba(0,0,0,.3);font-weight:700">빈자리</div>`);
      }
      body=`<div style="display:flex;gap:0.5vw;align-items:stretch">${slots.join('')}</div>`;
    } else {
      ids.forEach(id=>{ body+=bigSlot(attendMap[id]||{name:nameOf(id),gender:genderOf(id)}, conf, id); });
      for(let i=cnt;i<CMAX;i++) body+=emptySlot(conf);
    }
    const badgeStyle='padding:0.3vw 0.8vw;border-radius:1.5vw;font-size:1.3vw;font-weight:900;white-space:nowrap;letter-spacing:-0.01em';
    let ctStr='';
    if(!isNext && rec && rec.confirm && rec.confirm.confirmedAt){
      const em=Math.max(0,Math.floor((Date.now()-rec.confirm.confirmedAt)/60000));
      ctStr=em>=60?` ${Math.floor(em/60)}시간${em%60>0?em%60+'분':''}`:` ${em}분`;
    }
    const statusBadge = isNext ? ''
      : conf
        ? `<span style="background:rgba(255,255,255,.3);color:#fff;${badgeStyle}">확정${ctStr}</span>`
        : cnt>=CMAX
          ? `<span style="background:rgba(0,0,0,.2);color:#fff;${badgeStyle}">미확정</span>`
          : `<span style="background:rgba(0,0,0,.15);color:rgba(255,255,255,.9);${badgeStyle};font-weight:800">${cnt}/${CMAX}명 대기</span>`;
    // "게임끝" 버튼: index3.html의 코트 카드 "해제" 버튼과 동일 - 회원이 직접 눌러서 게임을
    // 끝낼 수 있게 한다. 인원이 있는 코트에만 노출한다.
    const gameEndBtn = (!isNext && cnt>0)
      ? `<button onclick="clearCourt(${n},false)" style="background:rgba(255,255,255,.9);color:#B25000;border:none;${badgeStyle};cursor:pointer;font-family:inherit">게임끝</button>`
      : '';
    // 다음차례 카드: "남자만/여자만/혼성" 버튼(추천팀을 그 자리에 바로 편성) + 4명 꽉 차면
    // "빈코트에 편성하기" 버튼(=index3.html의 확정 기능, 안전장치 포함)을 같이 보여준다.
    const nextFormBtnStyle=`${badgeStyle};background:rgba(255,255,255,.85);color:#1A1A1A;border:none;cursor:pointer;font-family:inherit`;
    const nextFormBtns = isNext
      ? `<button onclick="formGenderTeamToNext(${n},'m')" style="${nextFormBtnStyle}">남자만</button>
         <button onclick="formGenderTeamToNext(${n},'f')" style="${nextFormBtnStyle}">여자만</button>
         <button onclick="formGenderTeamToNext(${n},'mix')" style="${nextFormBtnStyle}">혼성</button>
         ${cnt===CMAX?`<button onclick="confirmNextCourt(${n})" style="${badgeStyle};background:#1D9E75;color:#fff;border:none;cursor:pointer;font-family:inherit">빈코트에 편성하기</button>`:''}`
      : '';
    const t=THEMES[curTheme];
    const cardBg = isNext ? t.cardBg2 : (conf ? t.cardBg1 : t.cardBg2);
    return`<div style="background:${cardBg};border-radius:1.4vw;padding:${isNext?'0.6vw 1.5vw':'1.2vw 1.5vw'};min-width:0;box-sizing:border-box;box-shadow:0 0.4vw 1.4vw rgba(0,0,0,.18)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1vw;flex-wrap:wrap;gap:0.4vw">
        <div style="display:flex;align-items:center;gap:0.6vw;flex-wrap:wrap">
          <span ${isNext?'':`onclick="toggleCourtActive(${n})"`} style="color:#fff;font-size:2.4vw;font-weight:900;text-shadow:0 2px 6px rgba(0,0,0,.5);letter-spacing:-0.02em${isNext?'':';cursor:pointer;text-decoration:underline'}">${isNext?('다음차례'+n):CNAME(n)}</span>
          ${gameEndBtn}
          ${nextFormBtns}
        </div>
        ${statusBadge}
      </div>
      ${body}
    </div>`;
  }

  const gap='0.8vw';
  let h='';

  const allRegular = MEMBERS;
  const maleMembers = allRegular.filter(m=>m.gender==='m');
  const femaleMembers = allRegular.filter(m=>m.gender==='f');
  const attendIds = new Set(Object.keys(attendMap).map(Number));
  const leftIds = new Set(leftList.map(a=>a.id));

  const vw = window.innerWidth;
  const qFs = vw >= 1200 ? '1.45vw' : vw >= 600 ? '2.2vw' : '3.1vw';
  const qPad = vw >= 1200 ? '3px 5px' : vw >= 600 ? '3px 4px' : '3px 3px';

  function quickBtn(m, fs){
    const isIn = attendIds.has(m.id);
    const isLeft = leftIds.has(m.id);
    const _qt=THEMES[curTheme];
    const bg = isIn ? _qt.inBg : isLeft ? _qt.leftBg : _qt.nonBg;
    const tc = isIn ? _qt.inTc : isLeft ? _qt.leftTc : _qt.nonTc;
    const onclick = isIn ? `doLeave(${m.id})` : `doAttend(${m.id})`;
    return `<div style="display:inline-flex;align-items:center;background:${bg};border-radius:4px;padding:${qPad};margin:3px 2px;cursor:pointer;flex-shrink:0;border:1px solid rgba(0,0,0,.08)" onclick="${onclick}">
      <span style="font-size:${fs};font-weight:700;color:${tc};white-space:nowrap">${m.name}</span>
    </div>`;
  }

  h+=`<div style="background:${THEMES[curTheme].panelBg};border-radius:1vw;padding:0.3vw 0.7vw;margin-bottom:${gap}">
    <div style="display:flex;align-items:flex-start;gap:0;margin-bottom:1px">
      <span style="font-size:${vw>=1200?'1.1vw':vw>=600?'1.5vw':'2.2vw'};font-weight:800;color:${THEMES[curTheme].femaleTc};margin-right:4px;flex-shrink:0;white-space:nowrap;padding-top:3px">여</span>
      <div style="display:flex;flex-wrap:wrap;gap:0;flex:1">${femaleMembers.map(m=>quickBtn(m,qFs)).join('')}</div>
    </div>
    <div style="display:flex;align-items:flex-start;gap:0;overflow:hidden">
      <span style="font-size:${vw>=1200?'1.1vw':vw>=600?'1.5vw':'2.2vw'};font-weight:800;color:${THEMES[curTheme].maleTc};margin-right:4px;flex-shrink:0;white-space:nowrap">남</span>
      <div style="display:flex;flex-wrap:wrap;gap:0;flex:1">${maleMembers.map(m=>quickBtn(m,qFs)).join('')}</div>
    </div>
  </div>`;

  h+=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:${gap};align-items:start;margin-bottom:${gap}">`;
  [1,2,3,4].forEach(n=>{ h+=bigCard(n,false); });
  h+='</div>';
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:${gap};align-items:start;margin-bottom:2vw">`;
  [1,2].forEach(n=>{ h+=bigCard(n,true); });
  h+='</div>';

  el.innerHTML=h;
}
function updateBoardClock(){
  const el=document.getElementById('board-clock');
  if(el) el.textContent=timeStr()+' '+todayLbl();
}
setInterval(updateBoardClock,1000);
updateBoardClock();
// 코트 카드의 "확정N분" 표시는 데이터가 바뀔 때만 다시 그려지는 renderBoard()로 계산되는데,
// 아무 데이터 변화 없이 시간만 흘러도 그 문구가 갱신되도록 30초마다 한 번씩 다시 그려준다.
setInterval(()=>{ if(typeof renderBoard==='function') renderBoard(); }, 30000);

/* ══════════════════════════════════════════════════════════════════════════
   시작 - 로그인 없이 바로 보드 모드로 들어간다. 크롬은 사용자 인터랙션 없이는
   음성을 재생할 수 없어서, 화면을 한 번 클릭해야 음성이 켜지도록 안내한다.
   ══════════════════════════════════════════════════════════════════════════ */
startSync();
(function startMonitor(){
  const overlay=document.createElement('div');
  overlay.id='monitor-start-overlay';
  overlay.style.cssText=[
    'position:fixed','inset:0','z-index:9999',
    'background:rgba(0,0,0,0.55)',
    'display:flex','flex-direction:column',
    'align-items:center','justify-content:center',
    'cursor:pointer'
  ].join(';');
  overlay.innerHTML=`
    <div style="color:#fff;font-size:3vw;font-weight:900;margin-bottom:1.5vw;text-shadow:0 2px 8px rgba(0,0,0,.5)">박달브라운 테니스 클럽</div>
    <div style="background:#1D9E75;color:#fff;font-size:2vw;font-weight:800;padding:1.2vw 3vw;border-radius:1.5vw;box-shadow:0 4px 20px rgba(0,0,0,.3)">
      화면을 클릭하면 모니터링이 시작됩니다
    </div>
    <div style="color:rgba(255,255,255,.7);font-size:1.2vw;margin-top:1vw">음성 알림을 활성화하려면 클릭이 필요합니다</div>
  `;
  overlay.addEventListener('click', function(){
    unlockSpeechSynthesis();
    overlay.remove();
  }, {once:true});
  document.body.appendChild(overlay);
})();
document.addEventListener('click', unlockSpeechSynthesis, {once:true});
document.addEventListener('touchstart', unlockSpeechSynthesis, {once:true});
</script>
</body>
