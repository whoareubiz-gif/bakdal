<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>박달브라운 테니스 클럽</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;background:#F5F4F1;color:#1A1A1A;touch-action:pan-y pinch-zoom;}
button,input,select{font-family:inherit;}
.hidden{display:none!important;}
/* 헤더 */
.hdr{background:#1D9E75;color:#fff;padding:12px 14px;}
.hdr-top{display:flex;align-items:center;gap:6px;}
.hdr-title{font-size:15px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.02em;}
.hdr-date{font-size:13px;opacity:.9;}
.hdr-mode{background:rgba(255,255,255,.25);border-radius:7px;padding:4px 8px;font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0;}
.hdr-logout{background:rgba(0,0,0,.15);border:none;color:#fff;border-radius:7px;padding:4px 7px;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.hdr-stats{display:flex;gap:6px;margin-top:8px;}
.hdr-stat{flex:1;background:rgba(255,255,255,.18);border-radius:9px;padding:1px 6px;display:flex;align-items:center;justify-content:space-between;gap:4px;}
.hdr-stat span{font-size:14px;font-weight:700;color:#fff;opacity:.92;white-space:nowrap;}
.hdr-stat span.male{color:#BFE0FF;}
.hdr-stat span.female{color:#FFC9DC;}
.hdr-stat b{font-size:22px;font-weight:900;}
/* 탭 */
.tabs{display:flex;background:#fff;border-bottom:1px solid #E0DFDB;padding:5px 6px;gap:4px;}
.me-actionbar{display:flex;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid #E0DFDB;}
.me-actionbar .btn{flex:1;padding:14px;font-size:16px;font-weight:900;border-radius:10px;}
.tab{flex:1;text-align:center;padding:8px 2px;font-size:14px;font-weight:700;color:#6B6862;cursor:pointer;border-radius:9px;transition:background-color .15s ease,color .15s ease;}
.tab.active{color:#fff;background:#1D9E75;box-shadow:0 2px 6px rgba(29,158,117,.35);}
.page{transition:opacity .15s ease;}
.page{padding-bottom:60px;}
/* 공용 */
.card{background:#fff;border:1px solid #E0DFDB;border-radius:12px;margin:8px 11px;box-shadow:0 2px 5px rgba(0,0,0,.06);overflow:hidden;}
.card-hd{padding:8px 10px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.card-bd{padding:6px 8px 8px;}
.stitle{font-size:15px;font-weight:800;margin:10px 11px 6px;display:flex;align-items:center;gap:5px;}
.btn{padding:8px 12px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.btn-primary{background:#1D9E75;color:#fff;}
.btn-court{background:#185FA5;color:#fff;}
.btn-gray{background:#F0EDE8;color:#666;}
.btn-red{background:#FDECEA;color:#C0392B;}
.chip{display:inline-block;font-size:10px;padding:2px 6px;border-radius:5px;font-weight:700;}
.chip-m{background:#E6F1FB;color:#185FA5;}
.chip-f{background:#FBEAF0;color:#993556;}
.chip-guest{background:#FCEFC7;color:#7A5F00;}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,.92);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:9999;max-width:88%;text-align:center;white-space:pre-line;}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9000;padding:20px;}
.modal-box{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:340px;box-shadow:0 16px 50px rgba(0,0,0,.3);}
.modal-msg{font-size:14px;white-space:pre-line;margin-bottom:16px;line-height:1.5;}
.modal-btns{display:flex;gap:8px;}
.modal-btns .btn{flex:1;padding:11px;font-size:13px;}
/* 코트 카드 */
.court-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:9px 11px;}
.ct-card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #E0DFDB;box-shadow:0 2px 5px rgba(0,0,0,.06);}
/* 대기자를 코트에 배정하면, 그 코트 카드가 잠깐 색이 들어오면서 "여기로 배정됐다"는 걸 보여준다 */
@keyframes ctAssignFlash{
  0%{box-shadow:0 0 0 4px rgba(29,158,117,0);}
  25%{box-shadow:0 0 0 4px rgba(29,158,117,.9);}
  100%{box-shadow:0 0 0 4px rgba(29,158,117,0);}
}
.ct-card.assign-flash{animation:ctAssignFlash 900ms ease-out;}
.ct-hd{padding:5px 8px;display:flex;align-items:center;gap:5px;color:#fff;font-weight:800;font-size:13px;flex-wrap:wrap;}
.ct-hd.st-active{background:#1D9E75;}
.ct-hd.st-next{background:#185FA5;}
.ct-hd.st-pending{background:#D97706;animation:pulse 1.1s ease-in-out infinite;}
.ct-hd.st-confirmed{background:#8A8D93;}
.ct-hd.st-off{background:#B8B5AF;}
@keyframes pulse{0%,100%{background-color:#D97706}50%{background-color:#F5A623}}
.ct-name{flex:1;}
.ct-hd-btn{padding:3px 8px;font-size:10px;font-weight:700;border-radius:6px;cursor:pointer;flex-shrink:0;}
.ct-hd-btn-confirm{background:rgba(255,255,255,.92);color:#1A1A1A;border:none;}
.ct-hd-btn-release{background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.4);}
.ct-bd{padding:4px;}
.ct-slot{display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:7px;background:#F5F4F1;margin-bottom:2px;font-size:14px;font-weight:700;cursor:pointer;}
.ct-empty{padding:3px;border:1px dashed #D8D5CF;border-radius:6px;text-align:center;color:#B8B5AF;font-size:11px;margin-bottom:2px;}
/* 대기자 */
.wait-wrap{display:flex;gap:6px;padding:0 11px;}
.wait-col{flex:1;background:#fff;border:1px solid #E0DFDB;border-radius:10px;overflow:hidden;}
.wait-hd{padding:6px;text-align:center;font-size:12px;font-weight:800;color:#fff;}
.wait-hd.m{background:#185FA5;}
.wait-hd.f{background:#993556;}
.wait-body{padding:6px;}
.wait-item{display:flex;justify-content:space-between;align-items:center;background:#F7F6F3;border:1px solid #E0DFDB;border-radius:7px;padding:6px 8px;margin-bottom:3px;font-size:13px;font-weight:700;}
.wait-assign-btn{flex:1;padding:3px 2px;font-size:11px;font-weight:700;border-radius:6px;border:1px solid #D8D5CF;background:#fff;color:#1D9E75;cursor:pointer;}
.wait-assign-btn-next{color:#185FA5;}
.wait-assign-btn-current{background:#1D9E75!important;color:#fff!important;border-color:#1D9E75!important;}
.wait-assign-btn-next.wait-assign-btn-current{background:#185FA5!important;border-color:#185FA5!important;}
.wait-assign-btn-disabled{background:#EDECE8!important;color:#C4C1BA!important;border-color:#E5E3DE!important;cursor:not-allowed;}
.wait-time{font-size:10px;color:#888;font-weight:600;}
/* 회원명부 / 참석자 리스트 */
.member-row{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid #F0EFEA;}
.member-row .nm{flex:1;font-size:14px;font-weight:700;}
.attend-btn{padding:5px 14px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer;}
.attend-btn.on{background:#E1F5EE;color:#0F6E56;}
.attend-btn.off{background:#F0EDE8;color:#888;}
/* 남/여 두 컬럼(좌남/우여) 레이아웃 */
.gender-cols{display:flex;gap:6px;padding:0 11px;}
.gender-col{flex:1;background:#fff;border:1px solid #E0DFDB;border-radius:10px;overflow:hidden;}
.gender-col-hd{padding:7px;text-align:center;font-size:12px;font-weight:800;color:#fff;}
.gender-col-hd.m{background:#185FA5;}
.gender-col-hd.f{background:#993556;}
.gender-col-body{padding:0;}
.search-bar{margin:8px 11px;padding:9px 12px;border:1px solid #D8D5CF;border-radius:10px;width:calc(100% - 22px);font-size:13px;}
/* 로그인 */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#1D9E75;}
.login-box{background:#fff;border-radius:18px;padding:26px 22px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.2);}
.login-title{font-size:20px;font-weight:900;text-align:center;margin-bottom:18px;color:#1D9E75;}
.login-box input{width:100%;padding:12px;border:1px solid #D8D5CF;border-radius:10px;font-size:15px;margin-bottom:10px;}
.login-box .btn{width:100%;padding:13px;font-size:14px;margin-bottom:8px;}
.login-suggest{max-height:180px;overflow-y:auto;margin-bottom:10px;}
.login-suggest div{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px;}
.login-suggest div:hover{background:#F0EDE8;}
</style>
</head>

/* ══════════════════════════════════════════════════════════════════════════
   Firebase 설정 - 기존 index.html과 같은 프로젝트를 그대로 쓰되, 경로는
   전부 새로(t3/ 이하) 분리해서 기존 index.html/monitor.html과 절대 겹치지 않는다.
   ══════════════════════════════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyD_anBSKfX8UsExUOQoDilhMJtDe8eoVks",
  authDomain: "bakdal-d30e6.firebaseapp.com",

  projectId: "bakdal-d30e6",

  messagingSenderId: "250451058346",
  appId: "1:250451058346:web:d1635d423763fba63cbad3",
  measurementId: "G-EEGPXMBXKL"

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const BASE = db.ref('t3');
const ATTEND_REF = BASE.child('attend');   // /t3/attend/{id} = 현재 출석중인 사람의 개인정보 (존재 자체가 "출석중"이라는 뜻)
const COURT_REF  = BASE.child('court');    // /t3/court/{1~4} = {m1..m4, gen, filledAt, confirm:{ids,committedGen}}
const NEXT_REF   = BASE.child('next');     // /t3/next/{1~2} = 위와 동일 구조 (다음차례)
const GAMES_REF  = BASE.child('games');    // /t3/games/{id} = 누적 게임수 (숫자, 트랜잭션 증감)
const LEFT_REF   = BASE.child('left');     // /t3/left/{id_attendTs} = 퇴소기록 (세션별로 한 번만 생성, 이후 수정 안 됨)
const META_REF   = BASE.child('meta');     // /t3/meta = {date, courtActive}
const GUEST_REF  = BASE.child('guests');   // /t3/guests = 오늘 등록된 게스트 이름 목록
const ADMIN_PIN_REF = BASE.child('adminPin'); // /t3/adminPin = 관리자 PIN(문자열)
const RESIMG_REF = db.ref('tennis_reservation_image'); // 예약표 이미지는 기존 index.html과 공유(단순 이미지 조회라 안전)
const HISTORY_REF = BASE.child('history'); // /t3/history/{yyyy-mm-dd}/{이름} = {gender, games} - 날짜별 게임수 기록 보관용

/* ══════════════════════════════════════════════════════════════════════════
   ⚠️ 설계 원칙 (이전 버전의 반복되던 버그들을 구조적으로 없애기 위함)
   1) 그 어떤 코드도 "전체 상태를 통째로 읽어서 통째로 다시 쓰는" 일을 하지 않는다.
      모든 쓰기는 자기가 바꾸려는 딱 그 조각(코트 1개, 회원 1명, 게임수 1명분)만
      Firebase 트랜잭션으로 "서버의 지금 값을 직접 읽어서" 안전하게 수정한다.
      → 오래된 기기가 재접속해도 "자기가 들고 있던 예전 정보"를 통째로 밀어넣을
        방법 자체가 없다 (그런 함수가 아예 없으므로).
   2) "확정 여부"는 별도의 값으로 저장하지 않고, "지금 인원 조합"과 "확정 당시
      인원 조합"을 비교해서 그 자리에서 판단한다(gen 카운터 방식). 인원이 바뀌면

  document.body.appendChild(ov);

}

function doAttend(memberId, isGuestName){
  if(appMode==='spectator'){ toast('관전 모드에서는 할 수 없습니다'); return; }
  if(attendMap[memberId]){ toast('이미 출석중입니다'); return; }
  const m = isGuestName ? null : MEMBERS.find(x=>x.id===memberId);
  const t=timeStr(), ts=nowTs();
  const rec = {
    name: isGuestName || m.name, gender: (isGuestName? _guestGenderPending : m.gender),
    attendTs: ts, time: t, isGuest: !!isGuestName,
    leavingScheduled:false, leavingScheduledAt:null,
    courtFreeAt:t, courtFreeTs:ts,
  };
  ATTEND_REF.child(memberId).set(rec);
  GAMES_REF.child(memberId).set(0);
}
let _guestGenderPending='m';
let guestRegistry={}; // GUEST_REF의 실시간 스냅샷 - 게스트 ID 충돌 방지에 사용
// 게스트 ID는 매번 "지금 실제로 쓰이고 있는 번호들"을 보고 그다음 빈 번호를 찾는다.
// (예전엔 새로고침하면 90000부터 다시 시작하는 카운터를 썼는데, 그러면 이미 등록된
// 게스트와 번호가 겹쳐서 두 번째 게스트 등록이 조용히 무시되는 버그가 있었음)
function nextGuestId(){
  const used = new Set([
    ...Object.keys(guestRegistry).map(Number),
    ...Object.keys(attendMap).map(Number).filter(id=>id>=90000),
    ...leftList.map(a=>a.id).filter(id=>id>=90000),
  ]);
  let id=90000;
  while(used.has(id)) id++;
  return id;
}

function deleteGuest(id){
  const g = guestRegistry[id]; if(!g) return;
  openModal(`⚠️ 게스트 "${g.name}"을(를) 완전히 삭제하시겠습니까?\n(출석 기록, 게임수, 퇴소기록이 모두 지워집니다)`, ()=>{

      GAMES_REF.child(id).remove();
      ATTEND_REF.child(id).remove();
      leftList.filter(x=>x.id===id).forEach(x=>LEFT_REF.child(x.key).remove());
      GUEST_REF.child(id).remove();
      toast(`${g.name} 삭제되었습니다`);
    };
    if(attendMap[id]) removeFromAnyCourtOrNext(id, finish);
    else finish();
  });
}
function removeFromAnyCourtOrNext(memberId, cb){
  const jobs=[];
  [1,2,3,4].forEach(n=>jobs.push(new Promise(res=>{
    COURT_REF.child(n).transaction(cur=>{
      if(!cur) return cur;
      let changed=false;
      SLOTS.forEach(k=>{ if(cur[k]===memberId){ cur[k]=null; changed=true; } });
      if(changed) cur.gen=(cur.gen||0)+1;
      return cur;
    }, ()=>res());
  })));
  [1,2].forEach(n=>jobs.push(new Promise(res=>{
    NEXT_REF.child(n).transaction(cur=>{
      if(!cur) return cur;
      let changed=false;
      SLOTS.forEach(k=>{ if(cur[k]===memberId){ cur[k]=null; changed=true; } });
      if(changed) cur.gen=(cur.gen||0)+1;
      return cur;
    }, ()=>res());
  })));
  Promise.all(jobs).then(()=>cb&&cb());
}
function doLeave(memberId){
  if(appMode==='spectator'){ toast('관전 모드에서는 할 수 없습니다'); return; }
  const a=attendMap[memberId]; if(!a) return;
  removeFromAnyCourtOrNext(memberId, ()=>{
    const games = gamesMap[memberId]||0;
    const leftT=timeStr(), leftTs=nowTs();
    const key = memberId+'_'+a.attendTs;
    LEFT_REF.child(key).set({
      id:memberId, name:a.name, gender:a.gender, games, time:a.time,
      leftAt:leftT, leftTs, attendTs:a.attendTs, isGuest:!!a.isGuest,
    });
    ATTEND_REF.child(memberId).remove();
    GAMES_REF.child(memberId).remove();
    toast(`${a.name} 퇴소 처리됨`);
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   코트 배정 / 해제 / 확정 - 전부 "그 코트 노드 하나"에 대한 트랜잭션.
   ══════════════════════════════════════════════════════════════════════════ */
function assignToCourt(memberId, n, isNext){
  if(appMode!=='admin'){ toast('관리 모드에서만 가능합니다'); return; }
  if(!isNext && !courtActive[n]){ toast('비활성화된 코트입니다'); return; }
  const a=attendMap[memberId]; if(!a){ toast('출석 정보가 없습니다'); return; }
  // 지금 배정되어 있는 바로 그 버튼을 다시 누르면 배정을 취소(원복)한다.
  const cur=currentAssignmentOf(memberId);
  if(cur && ((isNext && cur.type==='next' && cur.n===n) || (!isNext && cur.type==='court' && cur.n===n))){
    removeFromAnyCourtOrNext(memberId, ()=>{ toast(`${a.name}님 배정을 취소했습니다`); });
    return;
  }
  if(a.leavingScheduled){ toast('퇴소예정 회원은 배정할 수 없습니다'); return; }
  removeFromAnyCourtOrNext(memberId, ()=>{
    const ref = isNext ? NEXT_REF.child(n) : COURT_REF.child(n);
    ref.transaction(cur=>{
      cur = cur || {m1:null,m2:null,m3:null,m4:null,gen:0};
      if(SLOTS.some(k=>cur[k]===memberId)) return cur; // 이미 배정됨(멱등)
      const slot = SLOTS.find(k=>!cur[k]);
      if(!slot) return; // 자리 없음 → 트랜잭션 중단
      cur[slot]=memberId;
      const cnt = SLOTS.filter(k=>cur[k]).length;
      cur.gen = (cur.gen||0)+1;
      if(cnt===CMAX) cur.filledAt = Date.now();
      return cur;
    }, (err,committed)=>{
      if(err || !committed){ toast('배정할 자리가 없습니다'); return; }
      flashCourtCard(isNext?'n'+n:n);
    });
  });
}
// "게임중 → 다음차례 예약" 전용: 지금 뛰고 있는 코트에서는 절대 빼지 않고, 다음차례에만
// 추가/제거한다(assignToCourt처럼 removeFromAnyCourtOrNext를 먼저 하면 지금 게임중인 코트에서
// 이 사람이 빠져버려서 남은 인원의 확정까지 깨지므로, 그 부분을 건너뛴 전용 함수를 쓴다).
// 이미 그 다음차례에 예약되어 있으면 눌렀을 때 예약을 취소(토글)한다.
function reserveNextFromGame(memberId, n){
  if(appMode!=='admin'){ toast('관리 모드에서만 가능합니다'); return; }
  const ref = NEXT_REF.child(n);
  const alreadyThere = nextMap[n] && courtMembers(nextMap[n]).includes(memberId);
  if(alreadyThere){
    ref.transaction(cur=>{
      if(!cur) return cur;
      SLOTS.forEach(k=>{ if(cur[k]===memberId) cur[k]=null; });
      cur.gen=(cur.gen||0)+1;
      return cur;
    }, (err,committed)=>{
      if(err||!committed) return;
      toast(`${nameOf(memberId)}님의 다음차례${n} 예약을 취소했습니다`);
    });
    return;
  }
  ref.transaction(cur=>{
    cur = cur || {m1:null,m2:null,m3:null,m4:null,gen:0};
    if(SLOTS.some(k=>cur[k]===memberId)) return cur; // 이미 예약됨(멱등)
    const slot = SLOTS.find(k=>!cur[k]);
    if(!slot) return; // 자리 없음 → 중단
    cur[slot]=memberId;
    const cnt = SLOTS.filter(k=>cur[k]).length;
    cur.gen = (cur.gen||0)+1;
    if(cnt===CMAX) cur.filledAt = Date.now();
    return cur;
  }, (err,committed)=>{
    if(err || !committed){ toast('예약할 자리가 없습니다'); return; }
    flashCourtCard('n'+n);
    toast(`${nameOf(memberId)}님을 다음차례${n}로 예약했습니다`);
  });
}
// 배정 성공 직후, 그 코트 카드에 잠깐 초록색 테두리를 반짝여서 "여기로 배정됐다"를 보여준다.
// ⚠️ 배정하면 실시간 동기화로 화면 전체가 다시 그려지는데(그래야 새로 배정된 사람이 보이니까),
// 그때 카드 DOM 자체가 통째로 새로 만들어지면서 방금 붙인 CSS 클래스가 같이 사라져버린다.
// 그래서 클래스를 DOM에 직접 붙이는 대신, "이 코트는 언제까지 반짝여야 하는지"를 상태로 저장해두고
// buildCourtCard()가 카드를 새로 그릴 때마다 그 상태를 보고 반짝임 클래스를 포함시키도록 한다.
let courtFlashUntil={};

  if(appMode!=='admin'){ toast('관리 모드에서만 가능합니다'); return; }

}
function removeOneFromCourt(memberId, n, isNext){
  if(appMode!=='admin'){ toast('관리 모드에서만 가능합니다'); return; }
  // 확정된(=게임수가 이미 반영된) 코트에서 빼는 경우엔, 실수로 뺐다가 대기시간/게임수가
  // 이상해지는 걸 막기 위해 "일반 해제"와 "게임중 수정" 중 어떤 방식인지 먼저 물어본다.
  // (다음차례1,2는 확정 개념이 게임수와 무관하므로 이 선택 없이 바로 뺀다)
  if(!isNext && isConfirmed(courtMap[n])){
    showReleaseChoicePopup(memberId, n);
    return;
  }
  doRemoveFromCourtNode(memberId, n, isNext);
}
function doRemoveFromCourtNode(memberId, n, isNext){
  const ref = isNext?NEXT_REF.child(n):COURT_REF.child(n);
  ref.transaction(cur=>{
    if(!cur) return cur;
    SLOTS.forEach(k=>{ if(cur[k]===memberId) cur[k]=null; });
    cur.gen=(cur.gen||0)+1;
    return cur;
  });
}
function showReleaseChoicePopup(memberId, n){
  const name = nameOf(memberId);
  const old=document.getElementById('releaseChoiceOv'); if(old) old.remove();
  const ov=document.createElement('div'); ov.id='releaseChoiceOv'; ov.className='modal-ov';
  ov.innerHTML=`<div class="modal-box">
    <div style="font-size:17px;font-weight:900;margin-bottom:10px">${name}님 해제</div>
    <div style="font-size:13px;color:#555;margin-bottom:14px">${n}코트은 이미 확정된 코트입니다. 어떤 방식으로 해제할까요?</div>
    <button class="btn" style="width:100%;background:#185FA5;color:#fff;padding:13px;text-align:left;margin-bottom:8px;border-radius:10px" onclick="releaseNormal(${memberId},${n})">
      <div style="font-weight:800;font-size:14px">🔄 일반 해제</div>
      <div style="font-size:11px;opacity:.9;margin-top:2px">게임이 끝나서 코트를 비웁니다 (대기시간 새로 시작)</div>
    </button>
    <button class="btn" style="width:100%;background:#B25000;color:#fff;padding:13px;text-align:left;margin-bottom:8px;border-radius:10px" onclick="releaseMidGameFix(${memberId},${n})">
      <div style="font-weight:800;font-size:14px">🛠 게임중 수정</div>
      <div style="font-size:11px;opacity:.9;margin-top:2px">인원 실수 등 교정입니다 (대기시간 유지, 게임수 반영 안 함/되돌림)</div>
    </button>
    <button class="btn btn-gray" style="width:100%;padding:12px" onclick="document.getElementById('releaseChoiceOv').remove()">취소</button>
  </div>`;

  ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
}
// 일반 해제: 실제로 게임이 끝난 것이므로, 대기시간 기준 시각을 지금으로 새로 리셋한다.
function releaseNormal(memberId, n){
  doRemoveFromCourtNode(memberId, n, false);
  const t=timeStr(), ts=nowTs();
  ATTEND_REF.child(memberId).update({courtFreeAt:t, courtFreeTs:ts});
  const ov=document.getElementById('releaseChoiceOv'); if(ov) ov.remove();
  toast(`${nameOf(memberId)}님 일반 해제 완료`);
}
// 게임중 수정: 실제 게임을 한 게 아니라 배정 실수 교정이므로, 대기시간은 건드리지 않고
// 이미 반영된 게임수만 한 번 되돌려준다(확정 시 +1 됐던 것을 -1로 상쇄).
function releaseMidGameFix(memberId, n){
  doRemoveFromCourtNode(memberId, n, false);
  GAMES_REF.child(memberId).transaction(g=>Math.max(0,(g||0)-1));
  const ov=document.getElementById('releaseChoiceOv'); if(ov) ov.remove();
  toast(`${nameOf(memberId)}님 게임중 수정 완료 (게임수 -1)`);
}
// 확정 시도: 인원이 정확히 4명이고, "이번 조합(gen)"으로 아직 커밋 안 됐을 때만 성공.
// 여러 기기가 동시에 시도해도 Firebase 트랜잭션이 하나씩 순서대로 처리하므로 정확히 1번만 성공한다.
function tryConfirm(n, isNext){
  if(appMode!=='admin'){ toast('관리 모드에서만 가능합니다'); return; }
  const ref = isNext?NEXT_REF.child(n):COURT_REF.child(n);
  ref.transaction(cur=>{
    if(!cur) return;
    const ids = SLOTS.map(k=>cur[k]).filter(Boolean);
    if(ids.length!==CMAX) return; // 4명 아니면 확정 불가
    const idsKey = ids.slice().sort((a,b)=>a-b).join(',');
    if(cur.confirm && cur.confirm.committedGen===cur.gen) return; // 이미 이 조합으로 확정 완료
    cur.confirm = { ids: idsKey, committedGen: cur.gen, confirmedAt: Date.now() };
    return cur;
  }, (err,committed,snap)=>{
    if(err || !committed) return;
    const v = snap.val();
    if(v && v.confirm && v.confirm.committedGen===v.gen && v.confirm.confirmedAt && (Date.now()-v.confirm.confirmedAt)<3000){
      // 내가(이 트랜잭션 시도가) 방금 막 확정을 만든 경우에만 게임수 반영
      const ids = v.confirm.ids.split(',').map(Number);
      ids.forEach(id=> GAMES_REF.child(id).transaction(g=>(g||0)+1) );
    }
  });
}
function isConfirmed(rec){ return !!(rec && rec.confirm && rec.confirm.committedGen===rec.gen); }
function courtMembers(rec){ return rec ? SLOTS.map(k=>rec[k]).filter(Boolean) : []; }

// 다음차례1,2 전용 "확정": 4명을 실제 빈 코트로 옮겨준다. 게임수 반영/1분 자동확정과는 무관하다.
function confirmNextCourt(n){
  if(appMode!=='admin'){ toast('관리 모드에서만 가능합니다'); return; }
  const rec = nextMap[n];
  const ids = courtMembers(rec);
  if(ids.length!==CMAX){ toast('4명이 채워져야 확정할 수 있습니다'); return; }
  const emptyCourt = [1,2,3,4].find(cn=>courtActive[cn] && courtMembers(courtMap[cn]).length===0);
  if(!emptyCourt){
    openModal('⚠️ 배정 가능한 빈 코트가 없습니다.\n코트가 빌 때까지 기다려주세요.', null, '확인');
    return;
  }
  let i=0;
  function next(){
    if(i>=ids.length) return;
    const id=ids[i++];
    assignToCourt(id, emptyCourt, false);
    setTimeout(next,120); // 같은 코트로 순서대로 배정되도록 트랜잭션 사이에 살짝 간격을 둠
  }
  next();
}

/* ── 자동확정: 1분 지난 꽉 찬 코트를 매초 확인해서 시도 (관전모드는 시도 안 함) ── */
function checkAutoConfirm(){
  [1,2,3,4].forEach(n=>{
    const rec=courtMap[n];
    if(!rec || isConfirmed(rec)) return;
    const ids=courtMembers(rec);
    if(ids.length!==CMAX) return;
    if(!rec.filledAt || Date.now()-rec.filledAt < 60000) return;
    tryConfirm(n,false);
  });
  // ⚠️ 다음차례1,2는 1~4코트와 달리 "1분 뒤 자동확정" 개념이 없다. 다음차례의 "확정"은
  // 게임을 시작하는 게 아니라 "실제 빈 코트로 옮기는" 동작이므로, 관리자가 직접 확정
  // 버튼을 눌러야만 처리된다(confirmNextCourt 참고).
}

/* ══════════════════════════════════════════════════════════════════════════
   실시간 동기화 - 각 경로를 그냥 "구독"만 한다. 절대 되돌려 쓰지 않는다.
   ══════════════════════════════════════════════════════════════════════════ */
function startSync(){
  ATTEND_REF.on('value', snap=>{ attendMap = snap.val()||{}; readyFlags.attend=true; renderAll(); });
  COURT_REF.on('value', snap=>{ const v=snap.val()||{}; courtMap={1:v[1]||null,2:v[2]||null,3:v[3]||null,4:v[4]||null}; readyFlags.court=true; renderAll(); });
  NEXT_REF.on('value', snap=>{ const v=snap.val()||{}; nextMap={1:v[1]||null,2:v[2]||null}; readyFlags.next=true; renderAll(); });
  GAMES_REF.on('value', snap=>{ gamesMap = snap.val()||{}; readyFlags.games=true; renderAll(); });
  LEFT_REF.on('value', snap=>{
    const v=snap.val()||{};
    leftList = Object.keys(v).map(k=>({key:k, ...v[k]}));
    readyFlags.left=true; renderAll();
  });
  META_REF.on('value', snap=>{
    const v=snap.val()||{};
    todayDate = v.date||'';
    courtActive = v.courtActive || {1:true,2:true,3:true,4:true};
    readyFlags.meta=true;
    checkDateRollover();
    renderAll();
  });
  RESIMG_REF.on('value', snap=>{ reservationImageInfo = snap.val(); });
  GUEST_REF.on('value', snap=>{ guestRegistry = snap.val()||{}; renderAll(); });
  setInterval(()=>{ checkAutoConfirm(); updateClock(); }, 1000);
}
function allReady(){ return Object.values(readyFlags).every(Boolean); }
function checkDateRollover(){
  const today=dateStr();
  if(todayDate && todayDate!==today){
    // 날짜가 바뀌었는데 아직 초기화 안 됐으면, 관리자에게만 안내(자동으로 지우지는 않음 - 실수 방지)
    if(appMode==='admin'){
      const banner=document.getElementById('rolloverBanner');
      if(banner) banner.classList.remove('hidden');
    }
  }
}
// 오늘 데이터를 지우기 전에, 통계 이력(누가 몇 게임 했는지)만 이름 기준으로 보관해둔다.
// 나중에 "어제"나 "전체 기간" 통계를 볼 수 있게 하기 위함.
function archiveTodayStats(){
  const combined={};
  Object.keys(attendMap).forEach(id=>{
    const a=attendMap[id];
    const at = (a.attendTs!=null) ? a.attendTs : nowTs();
    const mins = Math.max(0,(nowTs()-at)/60);
    combined[a.name]={gender:a.gender, games: gamesMap[id]||0, minutes: mins};
  });
  leftList.forEach(a=>{
    const existing=combined[a.name];
    const at = (a.attendTs!=null) ? a.attendTs : nowTs();
    const lt = (a.leftTs!=null) ? a.leftTs : nowTs();
    const mins = Math.max(0,(lt-at)/60);
    combined[a.name]={
      gender:a.gender,
      games: Math.max(a.games||0, existing?existing.games:0),
      minutes: Math.max(mins, existing?existing.minutes:0),
    };
  });
  if(Object.keys(combined).length) HISTORY_REF.child(todayDate || dateStr()).set(combined);
}
function adminResetToday(){
  if(appMode!=='admin'){ toast('관리 모드에서만 가능합니다'); return; }
  openModal('⚠️ 오늘 데이터를 전부 지우고 새로 시작하시겠습니까?\n(출석/코트배정/게임수/퇴소기록이 모두 삭제됩니다. 통계 이력은 보관됩니다)', ()=>{
    archiveTodayStats();
    ATTEND_REF.set(null);
    COURT_REF.set(null);
    NEXT_REF.set(null);
    GAMES_REF.set(null);
    LEFT_REF.set(null);
    GUEST_REF.set(null);
    META_REF.update({date: dateStr(), courtActive:{1:true,2:true,3:true,4:true}});
    toast('✅ 초기화 완료');
  });
}
function toggleCourtActive(n){
  if(appMode!=='admin'){ toast('관리 모드에서만 가능합니다'); return; }
  const isOn = courtActive[n];
  if(isOn){
    // 지금 켜져있는 걸 끄려는 경우에만, 인원 배정/확정 여부를 확인한다(켜는 건 항상 허용).
    const rec = courtMap[n];
    const cnt = courtMembers(rec).length;
    if(cnt>0){ toast(`${n}코트에 배정된 인원이 있어 비활성화할 수 없습니다\n(먼저 해제해주세요)`); return; }
    if(isConfirmed(rec)){ toast(`${n}코트가 확정되어 있어 비활성화할 수 없습니다`); return; }
  }
  META_REF.child('courtActive').child(n).transaction(cur=>!cur);
}

const LOGIN_KEY='t3_login';
function saveLoginSession(mode, memberId){
  try{ localStorage.setItem(LOGIN_KEY, JSON.stringify({mode, memberId, expiry:Date.now()+1000*60*60*20})); }catch(e){}
}
function loadLoginSession(){
  try{
    const s=localStorage.getItem(LOGIN_KEY); if(!s) return null;
    const o=JSON.parse(s);
    if(!o.expiry || Date.now()>=o.expiry){ localStorage.removeItem(LOGIN_KEY); return null; }
    return o;
  }catch(e){ return null; }
}
// 이름 자동완성은 없앤다 - 이름을 정확히 입력하고 "로그인" 버튼을 눌러야 한다.
function doNameLogin(){
  const q=document.getElementById('loginSearch').value.trim();
  const errEl=document.getElementById('loginError');
  errEl.textContent='';
  if(!q){ errEl.textContent='이름을 입력해주세요'; return; }
  const matches=MEMBERS.filter(m=>m.name===q);
  if(matches.length===0){ errEl.textContent='일치하는 회원이 없습니다. 이름을 정확히 입력해주세요'; return; }
  if(matches.length>1){ errEl.textContent='동명이인이 있습니다. 관리자에게 문의해주세요'; return; }
  doMemberLogin(matches[0].id);
}
function doMemberLogin(memberId){
  meMember = MEMBERS.find(x=>x.id===memberId);

  saveLoginSession('member', memberId);
  enterApp();
}
function showAdminPinPrompt(){

/* PIN은 로그인 화면에서부터 필요하므로, 로그인 여부와 무관하게 즉시 구독을 시작한다 */
ADMIN_PIN_REF.on('value', snap=>{

/* 회원목록도 로그인 화면(이름 검색)에서부터 필요하므로 즉시 구독한다.
   최초 1회는 서버에 데이터가 없으므로, 위의 하드코딩된 시드 목록을 그대로 심어준다. */
MEMBERS_REF.on('value', snap=>{
  const v=snap.val();
  if(v){
    MEMBERS = Object.keys(v).map(id=>({id:Number(id), name:v[id].name, gender:v[id].gender}));
  } else {

    MEMBERS_REF.set(seed);

  const appEl=document.getElementById('app');
  if(appEl && !appEl.classList.contains('hidden')) renderAll();

(function tryAutoLogin(){

  if(s.mode==='admin'){ appMode='admin'; enterApp(); }

/* ══════════════════════════════════════════════════════════════════════════
   탭 전환 & 렌더링
   ══════════════════════════════════════════════════════════════════════════ */
function goTab(n, force){
  if(curTab===n && !force) return;
  const pages=[...document.querySelectorAll('.page')];
  const oldPage=(force ? null : pages[curTab]);
  curTab=n;
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active', i===n));
  if(oldPage && oldPage!==pages[n]){
    // 부드러운 전환: 지금 탭을 살짝 페이드아웃 → 전환 → 새 탭을 페이드인
    oldPage.style.opacity='0';
    setTimeout(()=>{
      pages.forEach((el,i)=>el.classList.toggle('hidden', i!==n));
      const newPage=pages[n];
      oldPage.style.opacity='';
      if(newPage){
        newPage.style.transition='none';
        newPage.style.opacity='0';
        void newPage.offsetWidth; // 리플로우 강제 - 트랜지션이 실제로 재생되게 함
        newPage.style.transition='';
        newPage.style.opacity='1';
      }
      renderAll();
    }, 130);
  } else {
    pages.forEach((el,i)=>el.classList.toggle('hidden', i!==n));
    renderAll();
  }
}
function visibleTabIndexes(){
  return [...document.querySelectorAll('.tab')]
    .map((el,i)=>({el,i}))
    .filter(o=>!o.el.classList.contains('hidden'))
    .map(o=>o.i);
}
// 화살표 버튼 - 스와이프가 기기/브라우저에 따라 잘 안 먹을 수 있어서, 항상 확실히 동작하는
// 대체 수단으로 좌우 화살표 버튼도 같이 둔다.
function goTabRelative(dir){
  const avail=visibleTabIndexes();
  const pos=avail.indexOf(curTab);
  if(pos<0) return;
  const nextPos=pos+dir;
  if(nextPos>=0 && nextPos<avail.length) goTab(avail[nextPos]);
}
/* ── 상단 탭 좌우 스와이프로 전환 (기존 index.html에 있던 기능) ──
   Pointer Events로 다시 구현(터치/마우스/펜을 하나로 통일해서 처리하는 표준 방식이라
   기존 touch 이벤트 방식보다 기기별 호환성이 더 안정적임). 보이는 탭들만 대상으로 하고,
   예약표 확대 화면처럼 자체적으로 가로 스크롤/줌이 필요한 팝업 위에서는 무시한다. */
(function initTabSwipe(){
  let sx=null, sy=null, active=false;
  document.addEventListener('pointerdown', e=>{
    const appEl=document.getElementById('app');
    if(!appEl || appEl.classList.contains('hidden')) return;
    if(e.target.closest && e.target.closest('.modal-ov, #resImgOv, #resImgScroll')) return;
    sx=e.clientX; sy=e.clientY; active=true;
  });
  document.addEventListener('pointerup', e=>{
    if(!active || sx===null) return;
    active=false;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    sx=null;
    if(Math.abs(dx)<45 || Math.abs(dx)<Math.abs(dy)*1.2) return; // 가로로 충분히, 세로보다 확실히 더 움직였을 때만
    goTabRelative(dx<0?1:-1); // 왼쪽으로 밀면 다음 탭, 오른쪽으로 밀면 이전 탭
  });
  document.addEventListener('pointercancel', ()=>{ active=false; sx=null; });
})();
function updateClock(){
  const el=document.getElementById('hdrDate');
  if(el){ const d=new Date(); el.textContent = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
}
function renderAll(){
  if(!document.getElementById('app') || document.getElementById('app').classList.contains('hidden')) return;
  updateClock();
  renderMeActionBar();
  try{
    const ids=Object.keys(attendMap).map(Number);
    const mCount=ids.filter(id=>attendMap[id] && attendMap[id].gender==='m').length;
    const fCount=ids.filter(id=>attendMap[id] && attendMap[id].gender==='f').length;
    document.getElementById('statTotal').textContent=ids.length;
    document.getElementById('statM').textContent=mCount;
    document.getElementById('statF').textContent=fCount;
    document.getElementById('statLeft').textContent=leftList.length;
  }catch(e){ console.error('상단 통계 렌더 오류:', e); }
  // 각 탭을 개별적으로 try/catch로 감싸서, 하나가 에러나도 다른 탭은 정상 동작하고
  // 에러난 탭은 "화면이 그냥 비어보이는" 대신 실제 원인이 보이도록 한다.
  function safeRender(tabIdx, pageId, fn){
    if(curTab!==tabIdx) return;
    const el=document.getElementById(pageId);
    if(!el) return;
    try{ el.innerHTML=fn(); }
    catch(e){
      console.error(pageId+' 렌더 오류:', e);
      el.innerHTML=`<div style="margin:12px;padding:14px;background:#FDECEA;border-radius:10px;color:#C0392B;font-size:12px;white-space:pre-wrap">⚠️ 화면을 그리는 중 오류가 발생했습니다.\n${e.message}\n\n(이 메시지를 캡처해서 알려주시면 원인을 바로 찾을 수 있습니다)</div>`;
    }
  }
  safeRender(0,'page0',renderMemberListPage);
  safeRender(1,'page1',renderTodayPage);
  safeRender(2,'page2',renderCourtsPage);
  safeRender(3,'page3',renderStatsPage);
  if(appMode==='admin') safeRender(4,'page4',renderAdminPage);
  checkAttendanceAnnouncements();
  checkGlobalCourtAnnouncements();
}

/* ══════════════════════════════════════════════════════════════════════════
   음성 안내 (기존 index.html과 동일) - 출석/퇴소/코트배정/코트확정 시 자동으로 읽어준다.
   ══════════════════════════════════════════════════════════════════════════ */
function unlockSpeechSynthesis(){
  if(speechUnlocked) return;
  try{
    if(!('speechSynthesis' in window)) return;
    const u=new SpeechSynthesisUtterance(' ');
    u.volume=0; u.lang='ko-KR';
    window.speechSynthesis.speak(u);
    speechUnlocked=true;
  }catch(e){}
}
document.addEventListener('click', unlockSpeechSynthesis, {once:true});
document.addEventListener('touchstart', unlockSpeechSynthesis, {once:true});

function speakStatus(text){
  notifyQueue.push(text);
  runNotifyQueue();
}
// 모바일 크롬은 cancel() 직후 곧바로 speak()를 부르면 새 발화가 그냥 조용히 씹히는(먹통이
// 되는) 유명한 버그가 있다. 그래서: (1) 지금 아무것도 말하고 있지 않으면 cancel() 없이
// 바로 speak(), (2) 말하고 있는 중이면 cancel() 후 약간 텀을 두고 speak(), (3) 그래도
// 일정 시간 안에 실제로 시작 안 했으면 한 번 더 시도한다.
function runNotifyQueue(){
  if(notifyQueueRunning) return;
  const next=notifyQueue.shift();
  if(!next) return;
  notifyQueueRunning=true;
  const done=()=>{ notifyQueueRunning=false; runNotifyQueue(); };
  try{
    if(!('speechSynthesis' in window)){ setTimeout(done,3000); return; }
    const speakNow=()=>{
      const utter=new SpeechSynthesisUtterance(next);
      utter.lang='ko-KR'; utter.rate=1.15; utter.pitch=1.0;
      try{
        const voices=window.speechSynthesis.getVoices();
        const koVoice=voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('ko'));
        if(koVoice) utter.voice=koVoice;
      }catch(e){}
      let started=false, fired=false;
      const safeDone=()=>{ if(fired)return; fired=true; done(); };
      utter.onstart=()=>{ started=true; };
      utter.onend=safeDone; utter.onerror=safeDone;
      try{ window.speechSynthesis.speak(utter); }catch(e){ safeDone(); return; }
      // 크롬 버그로 발화가 씹혔는지 확인 - 300ms 안에 실제로 시작 안 했으면 한 번 더 시도
      setTimeout(()=>{
        if(!started && !fired){
          try{ window.speechSynthesis.cancel(); window.speechSynthesis.speak(utter); }catch(e){}
        }
      }, 300);
      setTimeout(()=>{ if(!fired) safeDone(); }, 8000); // 그래도 안 되면 포기하고 다음 안내로 넘어감
    };
    if(window.speechSynthesis.speaking || window.speechSynthesis.pending){
      try{ window.speechSynthesis.cancel(); }catch(e){}
      setTimeout(speakNow, 120);
    } else {
      speakNow();
    }
  }catch(e){ done(); }
}
setInterval(()=>{ if(window.speechSynthesis && !notifyQueueRunning) window.speechSynthesis.resume(); }, 14000);

// 출석/퇴소 변화 감지 → 음성 안내
function checkAttendanceAnnouncements(){
  if(!allReady()) return; // 최초 동기화 전에는 스냅샷만 기록, 안내 안 함(과거 기록을 전부 읽어버리는 것 방지)
  const curAttendIds=new Set(Object.keys(attendMap).map(Number));
  const curLeftIds=new Set(leftList.map(x=>x.key));
  if(prevAttendIds!==null){
    curAttendIds.forEach(id=>{
      if(!prevAttendIds.has(id)){
        const a=attendMap[id];
        if(a) speakStatus(`${a.name} 회원님 출석하였습니다`);
      }
    });
  }
  if(prevLeftIds!==null){
    curLeftIds.forEach(key=>{
      if(!prevLeftIds.has(key)){
        const a=leftList.find(x=>x.key===key);
        if(a) speakStatus(`${a.name} 회원님 퇴소하였습니다`);
      }
    });
  }
  prevAttendIds=curAttendIds;
  prevLeftIds=curLeftIds;
}
// 코트별 "방금 4명 다 참" / "확정됨" 변화 감지 → 음성 안내
function checkGlobalCourtAnnouncements(){
  if(!allReady()){
    [1,2,3,4].forEach(n=>{ const rec=courtMap[n]; prevCourtSnapshot['c'+n]={cnt:courtMembers(rec).length, confirmed:isConfirmed(rec), key:courtMembers(rec).sort((a,b)=>a-b).join(',')}; });
    [1,2].forEach(n=>{ const rec=nextMap[n]; prevCourtSnapshot['n'+n]={cnt:courtMembers(rec).length, confirmed:isConfirmed(rec), key:courtMembers(rec).sort((a,b)=>a-b).join(',')}; });
    return;
  }
  [1,2,3,4].forEach(n=>{
    const rec=courtMap[n];
    const ids=courtMembers(rec);
    const cnt=ids.length, confirmed=isConfirmed(rec);
    const key=ids.slice().sort((a,b)=>a-b).join(',');
    const prev=prevCourtSnapshot['c'+n];
    if(prev){
      if(cnt===CMAX && !confirmed && (prev.key!==key || prev.cnt<CMAX)){
        const names=ids.map(id=>nameOf(id)).join(', ');
        speakStatus(`${CNAME(n)}에 ${names} 배정되었습니다`);
      }
      if(confirmed && !prev.confirmed){
        const names=ids.map(id=>nameOf(id)).join(', ');
        speakStatus(`${CNAME(n)}에 ${names} 확정되어 입장하십시오`);
      }
    }
    prevCourtSnapshot['c'+n]={cnt, confirmed, key};
  });
  [1,2].forEach(n=>{
    const rec=nextMap[n];
    const ids=courtMembers(rec);
    const cnt=ids.length;
    const key=ids.slice().sort((a,b)=>a-b).join(',');
    const prev=prevCourtSnapshot['n'+n];
    if(prev){
      if(cnt===CMAX && (prev.key!==key || prev.cnt<CMAX)){
        const names=ids.map(id=>nameOf(id)).join(', ');
        speakStatus(`다음차례${n}에 ${names} 배정되었습니다`);
      }
    }
    prevCourtSnapshot['n'+n]={cnt, confirmed:false, key};
  });
}

/* ── 탭0: 회원명부 ── */
function renderMemberListPage(){
  const list=MEMBERS.slice().sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  const mList=list.filter(m=>m.gender==='m');
  const fList=list.filter(m=>m.gender==='f');
  function rowHtml(m){
    const isOn=!!attendMap[m.id];
    return `<div class="member-row"><span class="nm">${m.name}</span>
      <button class="attend-btn ${isOn?'on':'off'}" onclick="${isOn?`doLeave(${m.id})`:`doAttend(${m.id})`}">${isOn?'출석중':'출석'}</button></div>`;
  }
  let h=`<div class="gender-cols">
    <div class="gender-col"><div class="gender-col-hd m">남 (${mList.length})</div><div class="gender-col-body">${mList.map(rowHtml).join('')||'<div style="text-align:center;color:#999;padding:16px 0">없음</div>'}</div></div>
    <div class="gender-col"><div class="gender-col-hd f">여 (${fList.length})</div><div class="gender-col-body">${fList.map(rowHtml).join('')||'<div style="text-align:center;color:#999;padding:16px 0">없음</div>'}</div></div>
  </div>`;
  return h;
}

/* ── 탭1: 오늘 참석자 (출석중 + 퇴소자) ── */
function renderTodayPage(){
  const ids=Object.keys(attendMap).map(Number).sort((a,b)=>(attendMap[b].attendTs||0)-(attendMap[a].attendTs||0));
  const mIds=ids.filter(id=>attendMap[id].gender==='m');
  const fIds=ids.filter(id=>attendMap[id].gender==='f');
  function attRow(id){
    const a=attendMap[id]; const games=gamesMap[id]||0;
    return `<div class="member-row" style="flex-wrap:wrap;row-gap:2px">
      <span class="nm" style="flex:1 1 auto;min-width:0">${a.name}${guestTag(a)}${a.leavingScheduled?'<span style="color:#C0392B;font-weight:900"> *</span>':''}</span>
      <span style="font-size:13px;color:#555;font-weight:600;white-space:nowrap">${a.time}</span>
      <span style="font-size:11px;font-weight:800;color:#1D9E75;white-space:nowrap">${games}게임</span>
      ${appMode==='admin'?`<button class="btn btn-red" style="padding:4px 8px;font-size:10px" onclick="doLeave(${id})">퇴소</button>`:''}
    </div>`;
  }
  let h=`<div class="stitle">📋 출석중 (${ids.length}명)</div>`;
  h+=`<div class="gender-cols">
    <div class="gender-col"><div class="gender-col-hd m">남 (${mIds.length})</div><div class="gender-col-body">${mIds.map(attRow).join('')||'<div style="text-align:center;color:#999;padding:16px 0">없음</div>'}</div></div>
    <div class="gender-col"><div class="gender-col-hd f">여 (${fIds.length})</div><div class="gender-col-body">${fIds.map(attRow).join('')||'<div style="text-align:center;color:#999;padding:16px 0">없음</div>'}</div></div>
  </div>`;
  if(leftList.length){
    const sortedLeft=leftList.slice().sort((a,b)=>(b.leftTs||0)-(a.leftTs||0));
    const mLeft=sortedLeft.filter(a=>a.gender==='m');
    const fLeft=sortedLeft.filter(a=>a.gender==='f');
    function leftRow(a){
      return `<div class="member-row" style="opacity:.75;flex-wrap:wrap;row-gap:2px">
        <span class="nm" style="flex:1 1 auto;min-width:0">${a.name}${guestTag(a)}</span>
        <span style="font-size:11.5px;color:#555;font-weight:600;white-space:nowrap">${a.time}→${a.leftAt}</span>
        <span style="font-size:11px;font-weight:800;color:#666;white-space:nowrap">${a.games||0}게임</span>
      </div>`;
    }
    h+=`<div class="stitle">🚪 퇴소자 (${leftList.length}명)</div>`;
    h+=`<div class="gender-cols">
      <div class="gender-col"><div class="gender-col-hd m">남 (${mLeft.length})</div><div class="gender-col-body">${mLeft.map(leftRow).join('')||'<div style="text-align:center;color:#999;padding:16px 0">없음</div>'}</div></div>
      <div class="gender-col"><div class="gender-col-hd f">여 (${fLeft.length})</div><div class="gender-col-body">${fLeft.map(leftRow).join('')||'<div style="text-align:center;color:#999;padding:16px 0">없음</div>'}</div></div>
    </div>`;
  }
  return h;
}
function whereIsMember(id){
  for(let n=1;n<=4;n++){ if(courtMap[n] && courtMembers(courtMap[n]).includes(id)) return CNAME(n); }
  for(let n=1;n<=2;n++){ if(nextMap[n] && courtMembers(nextMap[n]).includes(id)) return '다음'+n; }
  return '대기중';
}
function CNAME(n){ return n+'코트'; }

/* ── 탭2: 코트 현황 ── */
function nameOf(id){
  const a=attendMap[id]; if(a) return a.name;
  const m=MEMBERS.find(x=>x.id===id); return m?m.name:('id'+id);
}
function genderOf(id){
  const a=attendMap[id]; if(a) return a.gender;
  const m=MEMBERS.find(x=>x.id===id); return m?m.gender:'m';
}
function buildCourtCard(n, isNext){
  const rec = isNext?nextMap[n]:courtMap[n];
  const active = isNext?true:courtActive[n];
  const label = isNext?('다음차례'+n):CNAME(n);
  if(!active){
    return `<div class="ct-card"><div class="ct-hd st-off"><span class="ct-name">${label}</span>
      <button class="ct-hd-btn ct-hd-btn-release" onclick="toggleCourtActive(${n})">사용</button></div>
      <div class="ct-bd">${Array(CMAX).fill('<div class="ct-empty">사용 안 함</div>').join('')}</div></div>`;
  }
  const ids = courtMembers(rec);
  const cnt = ids.length;
  const conf = isConfirmed(rec);
  const full = cnt===CMAX;
  let stCls = isNext ? 'st-next' : 'st-active';
  // 다음차례1,2는 1분 자동확정 기능이 없으므로(확정=빈 코트로 이동일 뿐), 꽉 차도
  // "곧 자동확정될 것"을 알리는 주황색 깜빡임을 보여줄 필요가 없다 - 1~4코트만 깜빡인다.
  // 또한 1~4코트와 헷갈리지 않게 다음차례는 항상 다른 색(파란색 계열)으로 표시한다.
  if(!isNext && conf) stCls='st-confirmed'; else if(full && !isNext) stCls='st-pending';
  let slotsHtml='';
  ids.forEach(id=>{
    slotsHtml+=`<div class="ct-slot" onclick="${appMode==='admin'?`removeOneFromCourt(${id},${n},${isNext})`:''}"><span style="flex:1">${nameOf(id)}${genderOf(id)==='f'?'':''}</span>${genderChip(genderOf(id))}</div>`;
  });
  for(let i=cnt;i<CMAX;i++) slotsHtml+='<div class="ct-empty">— 빈자리 —</div>';
  // 다음차례1,2는 "확정"의 의미가 다르다: 게임을 시작하는 게 아니라 4명이 다 차면
  // 실제 빈 코트로 옮겨주는 것뿐이라, 1~4코트처럼 1분 자동확정도 없고 인원이 4명이
  // 다 차야만 버튼이 뜬다(부분 인원으로는 옮길 수 없으므로).
  const confirmBtn = appMode==='admin' && ((!isNext && !conf && cnt>0) || (isNext && cnt===CMAX))
    ? `<button class="ct-hd-btn ct-hd-btn-confirm" onclick="${isNext?`confirmNextCourt(${n})`:`tryConfirm(${n},false)`}">확정</button>`
    : '';
  const releaseBtn = appMode==='admin' ? `<button class="ct-hd-btn ct-hd-btn-release" onclick="clearCourt(${n},${isNext})">해제</button>` : '';
  const dropKey = isNext?'n'+n:n;
  const isFlashing = courtFlashUntil[dropKey] && courtFlashUntil[dropKey] > Date.now();
  return `<div class="ct-card${isFlashing?' assign-flash':''}" data-drop="${dropKey}">
    <div class="ct-hd ${stCls}"><span class="ct-name">${label}</span>${confirmBtn}${releaseBtn}</div>
    <div class="ct-bd">${slotsHtml}</div>
  </div>`;
}
function renderCourtsPage(){
  let h='';
  const resBtn = `<button class="btn btn-gray" style="padding:6px 10px;font-size:11px;flex-shrink:0" onclick="try{showResImgModal()}catch(e){alert('예약표 오류: '+e.message)}">🗓 예약표</button>`;
  if(appMode==='spectator') h+='<div style="background:#FFF8E1;padding:8px 12px;text-align:center;font-size:12px;font-weight:700;color:#B25000">👁 관전 모드 — 조작 불가</div>';
  if(appMode==='admin'){
    h+=`<div id="rolloverBanner" class="hidden" style="background:#FDECEA;color:#C0392B;padding:8px 12px;font-size:12px;font-weight:700;text-align:center">⚠️ 날짜가 바뀌었습니다. 관리 탭에서 초기화해주세요.</div>`;
    h+='<div style="padding:9px 11px 0;display:flex;gap:5px;align-items:center">';
    [1,2,3,4].forEach(n=>{
      const isOn=courtActive[n];
      h+=`<button onclick="toggleCourtActive(${n})" style="flex:1;padding:5px 4px;border-radius:8px;border:1.5px solid ${isOn?'#1D9E75':'#D8D5CF'};background:${isOn?'#E1F5EE':'#F0EDE8'};color:${isOn?'#1D9E75':'#aaa'};font-size:12px;font-weight:700">${isOn?'✅':'⬜'} ${n}코트</button>`;
    });
    h+=resBtn;
    h+='</div>';
  } else {
    h+=`<div style="padding:9px 11px 0;display:flex;justify-content:flex-end">${resBtn}</div>`;
  }
  h+='<div class="court-grid">';
  [1,2,3,4].forEach(n=>{ h+=buildCourtCard(n,false); });
  h+='</div>';
  h+='<div class="stitle">⏭ 다음차례</div><div class="court-grid">';
  [1,2].forEach(n=>{ h+=buildCourtCard(n,true); });
  h+='</div>';
  if(appMode==='admin'){
    h+=renderRecommendSection();
  }
  return h;
}

/* ── 추천팀 (대기시간순 + 랜덤, 혼성은 여성 1명 이상 보장) ── */
function setRecPickMode(kind,mode){ recPickMode[kind]=mode; renderAll(); }
// "대기자" = 확정된 코트에 있지 않은 모든 사람. 코트/다음차례에 배정되어 있어도 아직
// 확정 전이면 계속 대기자에 남아있고(버튼 색으로 어디 배정됐는지 표시), 확정되는 순간에만
// "게임중" 쪽으로 넘어가며 대기자 목록에서 빠진다.
function getWaitingIds(){
  return Object.keys(attendMap).map(Number)
    .filter(id=>{
      const a=attendMap[id];
      if(a.leavingScheduled) return false;
      for(let n=1;n<=4;n++){ if(courtMap[n] && isConfirmed(courtMap[n]) && courtMembers(courtMap[n]).includes(id)) return false; }
      return true;
    })
    .sort((a,b)=>(attendMap[a].attendTs||0)-(attendMap[b].attendTs||0));
}
// 완전히 자유로운(어디에도 배정 안 된) 사람만 - 추천팀의 1순위 후보
function getFreeIds(){
  return getWaitingIds().filter(id=>!currentAssignmentOf(id));
}
// 코트(1~4)에 배정됐지만 아직 미확정인 사람 - 추천팀 인원이 모자랄 때 2순위 후보
function getCourtAssignedUnconfirmedIds(){
  return getWaitingIds().filter(id=>{
    const cur=currentAssignmentOf(id);
    return cur && cur.type==='court';
  });
}
// 이미 확정되어 실제로 뛰고 있는 인원 - 대기시간순(courtFreeTs/attendTs)으로 정렬해서 반환한다.
// (자유인원+미확정 배정자가 4명이 안 될 때, 랜덤 추천에서 최대 2명까지만 보충용으로 쓴다)
function getConfirmedCourtIds(){
  const out=[];
  [1,2,3,4].forEach(n=>{ if(courtMap[n] && isConfirmed(courtMap[n])) out.push(...courtMembers(courtMap[n])); });
  return out
    .filter(id=>attendMap[id] && !attendMap[id].leavingScheduled)
    .sort((a,b)=>(attendMap[a].attendTs||0)-(attendMap[b].attendTs||0));
}
// 이 사람이 지금 어디 배정되어 있는지: {type:'court'|'next', n} 또는 배정 안 됐으면 null
function currentAssignmentOf(id){
  for(let n=1;n<=4;n++){ if(courtMap[n] && courtMembers(courtMap[n]).includes(id)) return {type:'court', n}; }
  for(let n=1;n<=2;n++){ if(nextMap[n] && courtMembers(nextMap[n]).includes(id)) return {type:'next', n}; }
  return null;
}
function shuffleArr(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// 랜덤 뽑기도 완전 무작위는 아니고, 가장 오래 대기한 2명은 항상 포함시키고 나머지만 랜덤으로 채운다.
// pool은 이미 대기시간순(오래된 순)으로 정렬되어 들어온다.
function pickRandom(n, pool, requireFemale){
  const guaranteedCount = Math.min(2, n, pool.length);
  let guaranteed = pool.slice(0, guaranteedCount); // 대기순 앞쪽 = 가장 오래 기다린 사람들
  let rest = pool.slice(guaranteedCount);
  if(requireFemale && !guaranteed.some(id=>genderOf(id)==='f')){
    const femaleInRest = rest.find(id=>genderOf(id)==='f');
    if(femaleInRest){
      guaranteed = guaranteed.slice(0,-1).concat(femaleInRest); // 마지막 한 자리를 여성으로 교체
      rest = pool.filter(id=>!guaranteed.includes(id));
    }
  }
  const fillCount = Math.max(0, n-guaranteed.length);
  return [...guaranteed, ...shuffleArr(rest).slice(0,fillCount)];
}
function waitMinutesOf(id){
  const a=attendMap[id];
  return Math.max(0,Math.floor((nowTs()-(a.courtFreeTs||a.attendTs||nowTs()))/60));
}
function renderRecommendSection(){
  const waiting=getWaitingIds(); // 대기자 화면 표시용(자유인원 + 미확정 배정자 모두 포함)
  const freeIds=getFreeIds(); // 추천 1순위: 완전히 자유로운 사람
  const fallbackIds=getCourtAssignedUnconfirmedIds(); // 추천 2순위: 코트 배정(미확정)자
  const confirmedFallbackIds=getConfirmedCourtIds(); // 추천 3순위(랜덤 전용, 최대 2명): 이미 확정되어 뛰고 있는 인원
  const mPool=waiting.filter(id=>genderOf(id)==='m');
  const fPool=waiting.filter(id=>genderOf(id)==='f');
  const mFree=freeIds.filter(id=>genderOf(id)==='m');
  const fFree=freeIds.filter(id=>genderOf(id)==='f');
  const mFallback=fallbackIds.filter(id=>genderOf(id)==='m');
  const fFallback=fallbackIds.filter(id=>genderOf(id)==='f');
  const mConfirmedFallback=confirmedFallbackIds.filter(id=>genderOf(id)==='m');
  const fConfirmedFallback=confirmedFallbackIds.filter(id=>genderOf(id)==='f');
  function team(kind,label,color,freePool,fallbackPool,confirmedPool,requireFemale){
    const mode=recPickMode[kind]||'order';
    let picked;
    if(mode==='order'){
      // 대기순: 오직 진짜 대기자만 넣는다 - 4명이 안 채워져도 그대로 둔다.
      picked = freePool.slice(0,4);
    } else {
      // 랜덤: 대기자 우선 → 부족하면 코트 배정중(미확정) 인원 → 그래도 부족하면 이미 확정된
      // (뛰고 있는) 인원을 최대 2명까지만 섞어서 4명을 채운다.
      let pool = freePool.slice();
      if(pool.length<4) pool = pool.concat(fallbackPool);
      if(pool.length<4){
        const need = Math.min(2, 4-pool.length);
        pool = pool.concat(confirmedPool.filter(id=>!pool.includes(id)).slice(0, need));
      }
      picked = pickRandom(Math.min(4,pool.length), pool, requireFemale);
    }
    if(!picked.length) return '';
    const usesAssigned = picked.some(id=>fallbackPool.includes(id) || confirmedPool.includes(id));
    const idsJson=JSON.stringify(picked);
    const members=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:4px">${picked.map(id=>{
      const cur=currentAssignmentOf(id);
      const tag = cur ? `<span style="color:#185FA5;font-size:9px;font-weight:700"> (${cur.type==='court'?cur.n+'코트':'다'+cur.n})</span>` : '';
      return `<div style="display:flex;align-items:center;gap:5px;padding:6px 7px;background:#F5F4F1;border-radius:7px;overflow:hidden"><span style="flex:1;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${nameOf(id)}${tag}</span><span style="font-size:9px;color:#888;flex-shrink:0">${waitMinutesOf(id)}분</span>${genderChip(genderOf(id))}</div>`;
    }).join('')}</div>`;
    // 이 팀에 이미 코트 배정된(미확정) 인원이 섞여있으면, 동시에 두 코트에 배정되는 사고를
    // 막기 위해 1~4코트 즉시배정은 아예 숨기고 "다음차례" 예약만 가능하게 한다.
    const assignedNotice = usesAssigned ? '<div style="font-size:10px;color:#B25000;margin-bottom:4px">※ 코트 배정중인 인원 포함 - 다음차례로만 예약 가능</div>' : '';
    const courtBtns = usesAssigned ? '' : [1,2,3,4].filter(cn=>courtActive[cn]).map(cn=>{
      const full = courtMembers(courtMap[cn]).length>=CMAX;
      return full
        ? `<button class="btn btn-gray" style="flex:1;padding:6px 2px;opacity:.5" disabled>${cn}코트</button>`
        : `<button class="btn btn-court" style="flex:1;padding:6px 2px" onclick="checkAndAssignTeam(${idsJson},${cn},false)">${cn}코트</button>`;
    }).join('');
    const nextBtns=[1,2].map(nn=>`<button class="btn btn-primary" style="flex:1;padding:6px 2px" onclick="checkAndAssignTeam(${idsJson},${nn},true)">다음차례${nn}</button>`).join('');
    return `<div class="card"><div class="card-bd">
      <div style="display:flex;align-items:center;margin-bottom:6px"><span style="font-weight:800;color:${color};flex:1">${label}</span>
        <button onclick="setRecPickMode('${kind}','order')" style="padding:3px 8px;border-radius:6px;border:1px solid ${mode==='order'?color:'#D8D5CF'};background:${mode==='order'?color:'#fff'};color:${mode==='order'?'#fff':'#999'};font-size:10px;font-weight:700;margin-right:4px">대기순</button>
        <button onclick="setRecPickMode('${kind}','random')" style="padding:3px 8px;border-radius:6px;border:1px solid ${mode==='random'?color:'#D8D5CF'};background:${mode==='random'?color:'#fff'};color:${mode==='random'?'#fff':'#999'};font-size:10px;font-weight:700">랜덤</button>
      </div>
      ${members}
      ${assignedNotice}
      <div style="display:flex;gap:3px">${courtBtns}${nextBtns}</div>
    </div></div>`;
  }
  let h='<div class="stitle">📌 다음 게임 추천</div>';
  h+=team('male','👨 추천 - 남자','#185FA5',mFree,mFallback,mConfirmedFallback,false);
  h+=team('female','👩 추천 - 여자','#993556',fFree,fFallback,fConfirmedFallback,false);
  h+=team('mixed','👫 추천 - 혼성','#7B3FA0',freeIds,fallbackIds,confirmedFallbackIds,true);
  h+='<div class="stitle">⏳ 대기자 <span style="font-size:10px;color:#888;font-weight:400">· 버튼을 누르면 바로 배정됩니다</span></div><div class="wait-wrap">';
  h+=`<div class="wait-col"><div class="wait-hd m">남자 (${mPool.length})</div><div class="wait-body">${mPool.map(id=>waitItemHtml(id)).join('')||'<div style="text-align:center;color:#B8B5AF;padding:10px 0">없음</div>'}</div></div>`;
  h+=`<div class="wait-col"><div class="wait-hd f">여자 (${fPool.length})</div><div class="wait-body">${fPool.map(id=>waitItemHtml(id)).join('')||'<div style="text-align:center;color:#B8B5AF;padding:10px 0">없음</div>'}</div></div>`;
  h+='</div>';
  // ── 게임중(확정된 코트)인 인원 → 다음차례로 미리 예약 가능 (기존 index.html에 있던 기능) ──
  const confirmedIds=[];
  [1,2,3,4].forEach(n=>{ if(courtMap[n] && isConfirmed(courtMap[n])) confirmedIds.push(...courtMembers(courtMap[n])); });
  const mConf=confirmedIds.filter(id=>genderOf(id)==='m');
  const fConf=confirmedIds.filter(id=>genderOf(id)==='f');
  function confirmedItemHtml(id){
    const alreadyReserved = [1,2].some(nn=>nextMap[nn] && courtMembers(nextMap[nn]).includes(id));
    const cur=currentAssignmentOf(id);
    const courtLabel = (cur && cur.type==='court') ? `<span style="font-size:10px;color:#888;font-weight:700;margin-left:2px">${cur.n}코트</span>` : '';
    const nextBtns=[1,2].map(nn=>{
      const isCur = nextMap[nn] && courtMembers(nextMap[nn]).includes(id);
      return `<button class="wait-assign-btn wait-assign-btn-next${isCur?' wait-assign-btn-current':''}" onclick="reserveNextFromGame(${id},${nn})">다${nn}</button>`;
    }).join('');
    return `<div class="wait-item" style="flex-direction:column;align-items:stretch;gap:5px;background:#EDF5FF">
      <span>${nameOf(id)}${genderChip(genderOf(id))}${courtLabel}${alreadyReserved?'<span style="font-size:10px;color:#185FA5;font-weight:700"> · 예약됨</span>':''}</span>
      <div style="display:flex;gap:3px">${nextBtns}</div>
    </div>`;
  }
  h+='<div class="stitle">🎾 게임중 → 다음차례 예약 <span style="font-size:10px;color:#888;font-weight:400">· 확정된 코트 인원 (한 명만 뽑아도 지금 게임은 계속됩니다)</span></div><div class="wait-wrap">';
  h+=`<div class="wait-col"><div class="wait-hd m">남자 (${mConf.length})</div><div class="wait-body">${mConf.map(confirmedItemHtml).join('')||'<div style="text-align:center;color:#B8B5AF;padding:10px 0">없음</div>'}</div></div>`;
  h+=`<div class="wait-col"><div class="wait-hd f">여자 (${fConf.length})</div><div class="wait-body">${fConf.map(confirmedItemHtml).join('')||'<div style="text-align:center;color:#B8B5AF;padding:10px 0">없음</div>'}</div></div>`;
  h+='</div><div style="height:12px"></div>';
  return h;
}
function waitItemHtml(id){
  const a=attendMap[id];
  const mins=waitMinutesOf(id);
  const cur=currentAssignmentOf(id);
  const courtBtns=[1,2,3,4].filter(cn=>courtActive[cn]).map(cn=>{
    const isCur = cur && cur.type==='court' && cur.n===cn;
    const confirmed = isConfirmed(courtMap[cn]);
    if(confirmed && !isCur) return `<button class="wait-assign-btn wait-assign-btn-disabled" disabled>${cn}</button>`;
    return `<button class="wait-assign-btn${isCur?' wait-assign-btn-current':''}" onclick="assignToCourt(${id},${cn},false)">${cn}</button>`;
  }).join('');
  const nextBtns=[1,2].map(nn=>{
    const isCur = cur && cur.type==='next' && cur.n===nn;
    return `<button class="wait-assign-btn wait-assign-btn-next${isCur?' wait-assign-btn-current':''}" onclick="assignToCourt(${id},${nn},true)">다${nn}</button>`;
  }).join('');
  const statusLine = cur ? '<div style="font-size:10px;color:#888;text-align:center">— 코트 배정 중 (미확정) —</div>' : '';
  const longWaitBadge = mins>=30 ? '<span style="font-size:9px;color:#fff;background:#C0392B;padding:1px 5px;border-radius:5px;font-weight:800;margin-left:4px">긴 대기중</span>' : '';
  return `<div class="wait-item" style="flex-direction:column;align-items:stretch;gap:3px">
    <div style="display:flex;justify-content:space-between;align-items:center"><span>${a.name}${guestTag(a)}${longWaitBadge}</span><span class="wait-time">${mins}분</span></div>
    <div style="display:flex;gap:3px">${courtBtns}${nextBtns}</div>
    ${statusLine}
  </div>`;
}
function assignTeamToCourt(ids, n, isNext){
  let i=0;
  function next(){
    if(i>=ids.length) return;
    const id=ids[i++];
    assignToCourt(id,n,isNext);
    setTimeout(next,120); // 코트 자리 트랜잭션이 순서대로 처리되도록 살짝 간격을 둠
  }
  next();
}
// 추천팀 배정 전, 팀원 중 이미 다른 코트에 배정/확정되어 있는 사람이 있으면 경고하고 막는다.
// (같은 사람이 동시에 두 코트에 배정되는 사고를 방지)
function checkAndAssignTeam(ids, n, isNext){
  const busy = ids.filter(id=>{
    const loc = whereIsMember(id);
    // 다음차례로 예약하는 경우엔, 지금 코트에 있어도 괜찮다(거기서 빼서 다음차례로 예약해두는
    // 것이 정상 시나리오임 - 추천팀이 "코트 배정중(미확정)" 인원을 보충했을 때 쓰는 흐름).
    // 단, 이미 다음차례에 있는 사람을 또 다른 다음차례에 넣는 것만 막는다.
    if(isNext) return loc.startsWith('다음');
    return loc.endsWith('코트') || loc.startsWith('다음');
  });
  if(busy.length){
    const names = busy.map(id=>`${nameOf(id)}(${whereIsMember(id)})`).join(', ');
    openModal(`⚠️ 다음 인원이 이미 다른 곳에 배정되어 있어 배정할 수 없습니다.\n${names}\n\n먼저 해당 인원을 해제한 뒤 다시 시도해주세요.`, null, '확인');
    return;
  }
  assignTeamToCourt(ids, n, isNext);
}

/* ── 탭3: 통계 (오늘자 게임수 순위만 - 과거 이력은 새 구조 시작이라 없음) ── */
function yesterdayDateStr(){
  const base = todayDate ? new Date(todayDate+'T00:00:00') : new Date();
  const d = new Date(base.getTime()-86400000);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function setStatsViewMode(mode){
  statsViewMode=mode;
  if(mode==='yesterday' && yesterdayStatsCache===null){
    HISTORY_REF.child(yesterdayDateStr()).once('value').then(snap=>{
      yesterdayStatsCache = snap.val()||{};
      renderAll();
    });
  }
  renderAll();
}
// 지금까지 쌓인 모든 날짜의 기록 + 오늘의 실시간 기록을 이름 기준으로 합산한다.
// 게임수뿐 아니라 참석 시간(분)도 같이 합산해서, "30분당 게임수"를 전체 기간 기준으로 계산한다.
function loadAllTimeStatsIfNeeded(){
  if(allTimeStatsCache!==null) return;
  HISTORY_REF.once('value').then(snap=>{
    const all=snap.val()||{};
    const sums={};
    Object.values(all).forEach(dayData=>{
      Object.keys(dayData||{}).forEach(name=>{
        const e=dayData[name];
        if(!sums[name]) sums[name]={gender:e.gender, games:0, minutes:0};
        sums[name].games += (e.games||0);
        sums[name].minutes += (e.minutes||0);
      });
    });
    Object.keys(attendMap).forEach(id=>{
      const a=attendMap[id];
      if(!sums[a.name]) sums[a.name]={gender:a.gender, games:0, minutes:0};
      sums[a.name].games += (gamesMap[id]||0);
      const at = (a.attendTs!=null) ? a.attendTs : nowTs();
      sums[a.name].minutes += Math.max(0,(nowTs()-at)/60);
    });
    leftList.forEach(a=>{
      if(!sums[a.name]) sums[a.name]={gender:a.gender, games:0, minutes:0};
      sums[a.name].games += (a.games||0);
      const at = (a.attendTs!=null) ? a.attendTs : nowTs();
      const lt = (a.leftTs!=null) ? a.leftTs : nowTs();
      sums[a.name].minutes += Math.max(0,(lt-at)/60);
    });
    Object.values(sums).forEach(s=>{ s.rate = s.minutes>=5 ? s.games/(s.minutes/30) : 0; });
    allTimeStatsCache=sums;
    renderAll();
  });
}
function renderStatsPage(){
  loadAllTimeStatsIfNeeded();
  function buildTodayRows(){
    const ids=[...Object.keys(attendMap).map(Number), ...leftList.map(a=>a.id)];
    const uniqIds=[...new Set(ids)];
    return uniqIds.map(id=>{
      const a=attendMap[id];
      const left=leftList.filter(x=>x.id===id).sort((x,y)=>(y.leftTs||0)-(x.leftTs||0))[0];
      const games = a ? (gamesMap[id]||0) : (left?left.games:0);
      const name = a?a.name:(left?left.name:nameOf(id));
      const gender = a?a.gender:(left?left.gender:genderOf(id));
      const attendTs = a?a.attendTs:(left?left.attendTs:0);
      // 30분당 게임수: 참석 시간이 짧을수록(막 출석했을수록) 불리하지 않도록, 아직 5분이 안
      // 지났으면 0으로 취급해서 목록 맨 위(적게 한 사람)에 자연스럽게 오게 한다.
      const elapsedMin = a ? Math.max(0,(nowTs()-attendTs)/60) : (left ? Math.max(0,(left.leftTs-attendTs)/60) : 0);
      const rate = elapsedMin>=5 ? games/(elapsedMin/30) : 0;
      return {name,gender,games,rate};
    }).sort((a,b)=>a.rate-b.rate);
  }
  function buildHistoryRows(dayData, useRate){
    if(!dayData) return [];
    const rows = Object.keys(dayData).map(name=>({
      name, gender:dayData[name].gender, games:dayData[name].games,
      rate: useRate ? (dayData[name].rate||0) : null,
    }));
    return useRate ? rows.sort((a,b)=>a.rate-b.rate) : rows.sort((a,b)=>b.games-a.games);
  }
  function statRow(r){
    const rateHtml = r.rate!==null ? `<span style="font-size:12px;font-weight:900;color:#185FA5;flex-shrink:0;margin-right:6px">${r.rate.toFixed(1)}/30분</span>` : '';
    return `<div class="member-row"><span class="nm">${r.name}</span>
      ${rateHtml}
      <span style="font-size:12px;font-weight:900;color:#1D9E75;flex-shrink:0">${r.games}게임</span></div>`;
  }
  function genderCols(rows){
    const mRows=rows.filter(r=>r.gender==='m');
    const fRows=rows.filter(r=>r.gender==='f');
    return `<div class="gender-cols">
      <div class="gender-col"><div class="gender-col-hd m">남 (${mRows.length})</div><div class="gender-col-body">${mRows.map(statRow).join('')||'<div style="text-align:center;color:#999;padding:16px 0">없음</div>'}</div></div>
      <div class="gender-col"><div class="gender-col-hd f">여 (${fRows.length})</div><div class="gender-col-body">${fRows.map(statRow).join('')||'<div style="text-align:center;color:#999;padding:16px 0">없음</div>'}</div></div>
    </div>`;
  }
  let h='<div class="stitle">📊 게임수 순위</div>';
  h+=`<div style="display:flex;gap:6px;padding:0 11px 8px">
    <button onclick="setStatsViewMode('today')" style="flex:1;padding:7px;border-radius:8px;border:1.5px solid ${statsViewMode==='today'?'#1D9E75':'#D8D5CF'};background:${statsViewMode==='today'?'#1D9E75':'#fff'};color:${statsViewMode==='today'?'#fff':'#888'};font-size:12px;font-weight:700">오늘</button>
    <button onclick="setStatsViewMode('yesterday')" style="flex:1;padding:7px;border-radius:8px;border:1.5px solid ${statsViewMode==='yesterday'?'#1D9E75':'#D8D5CF'};background:${statsViewMode==='yesterday'?'#1D9E75':'#fff'};color:${statsViewMode==='yesterday'?'#fff':'#888'};font-size:12px;font-weight:700">어제</button>
  </div>`;
  if(statsViewMode==='today'){
    h+='<div style="padding:0 11px 4px;font-size:10px;color:#888">· 30분당 게임수가 적은 순</div>';
    h+=genderCols(buildTodayRows());
  } else {
    if(yesterdayStatsCache===null){
      h+='<div style="text-align:center;color:#999;padding:20px">불러오는 중...</div>';
    } else {
      h+='<div style="padding:0 11px 4px;font-size:10px;color:#888">· 게임수 많은 순</div>';
      h+=genderCols(buildHistoryRows(yesterdayStatsCache, false));
    }
  }
  h+='<div class="stitle">🗂 전체 기간 통계 <span style="font-size:10px;color:#888;font-weight:400">· 30분당 게임수가 적은 순</span></div>';
  if(allTimeStatsCache===null){
    h+='<div style="text-align:center;color:#999;padding:20px">불러오는 중...</div>';
  } else {
    h+=genderCols(buildHistoryRows(allTimeStatsCache, true));
  }
  return h;
}

/* ── 탭4: 관리 ── */
function renderAdminPage(){
  let h='';

  h+='<div class="stitle">👤 게스트 등록</div><div class="card"><div class="card-bd">';
  h+=`<input id="guestNameInput" placeholder="게스트 이름" style="width:100%;padding:9px;border:1px solid #D8D5CF;border-radius:8px;font-size:13px;margin-bottom:6px">
    <div style="display:flex;gap:6px">
      <button class="btn btn-gray" style="flex:1" onclick="registerGuest(document.getElementById('guestNameInput').value,'m')">남자로 출석</button>
      <button class="btn btn-gray" style="flex:1" onclick="registerGuest(document.getElementById('guestNameInput').value,'f')">여자로 출석</button>
    </div>
    ${renderTodayGuestList()}
  </div></div>`;

  h+='<div class="stitle">➕ 회원 추가</div><div class="card"><div class="card-bd">';
  h+=`<div style="display:flex;gap:6px">      <input id="newMemberName" placeholder="이름" style="flex:1;padding:9px;border:1px solid #D8D5CF;border-radius:8px;font-size:13px">
      <select id="newMemberGender" style="padding:9px;border:1px solid #D8D5CF;border-radius:8px;font-size:13px"><option value="m">남</option><option value="f">여</option></select>
      <button class="btn btn-primary" onclick="addMember()">추가</button>
    </div></div></div>`;

  h+='<div class="stitle">🔍 회원 검색·수정·삭제</div><div class="card"><div class="card-bd">';
  h+=`<input id="memberMgmtSearch" class="search-bar" style="margin:0 0 4px" placeholder="회원 이름 검색" oninput="rerenderAdminMemberList()">`;
  h+=`<div id="memberMgmtList">${renderMemberMgmtList()}</div>`;
  h+='</div></div>';

  h+='<div class="stitle">🗓 이번달 코트 예약표</div><div class="card"><div class="card-bd">';
  h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">`;
  if(reservationImageInfo && reservationImageInfo.dataUrl){
    h+=`<img src="${reservationImageInfo.dataUrl}" style="width:52px;height:52px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid #E0DFDB" onclick="try{showResImgModal()}catch(e){alert('예약표 오류: '+e.message)}">
      <span style="flex:1;font-size:12px;color:#666">등록됨 · 탭하면 크게 보기</span>`;
  } else {
    h+=`<span style="flex:1;font-size:12px;color:#999">등록된 예약표 없음</span>`;
  }
  h+=`</div>
    <input type="file" id="resImgInput" accept="image/*" style="width:100%;font-size:12px;margin-bottom:6px">
    <button class="btn btn-primary" style="width:100%" onclick="uploadResImg()">업로드</button></div></div>`;

  h+='<div class="stitle">🔑 관리자 PIN 변경</div><div class="card"><div class="card-bd">';
  h+=`<input type="password" id="newPinInput" placeholder="새 PIN" style="width:100%;padding:9px;border:1px solid #D8D5CF;border-radius:8px;font-size:13px;margin-bottom:6px">
    <button class="btn btn-primary" style="width:100%" onclick="changeAdminPin()">변경</button></div></div>`;

  h+='<div class="stitle">⚠️ 위험 작업</div><div class="card"><div class="card-bd">';
  h+=`<button class="btn btn-red" style="width:100%;margin-bottom:8px" onclick="leaveAllAttendees()">전체 퇴소</button>
    <button class="btn btn-red" style="width:100%" onclick="adminResetToday()">오늘 데이터 초기화</button></div></div>`;
  return h;
}
function changeAdminPin(){
  const v=document.getElementById('newPinInput').value.trim();
  if(!v){ toast('새 PIN을 입력해주세요'); return; }
  ADMIN_PIN_REF.set(v);
  toast('✅ 관리자 PIN이 변경되었습니다');
  document.getElementById('newPinInput').value='';
}
/* ── 회원 관리(추가/수정/삭제) ── */
function renderMemberMgmtList(){
  const q=(document.getElementById('memberMgmtSearch')?.value)||'';
  if(!q.trim()) return '<div style="color:#B8B5AF;font-size:12px;padding:6px 2px">이름을 검색하면 결과가 여기에 나옵니다</div>';
  const list=MEMBERS.filter(m=>m.name.includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  if(!list.length) return '<div style="color:#999;padding:10px 0">검색 결과 없음</div>';
  return list.map(m=>`<div style="padding:7px 0;border-bottom:1px solid #F0EFEA">
    <div style="display:flex;gap:6px;margin-bottom:5px">
      <input value="${m.name}" id="mname_${m.id}" style="flex:1;min-width:0;padding:6px;border:1px solid #D8D5CF;border-radius:6px;font-size:13px">
      <select id="mgender_${m.id}" style="padding:6px;border:1px solid #D8D5CF;border-radius:6px;font-size:13px;flex-shrink:0">
        <option value="m" ${m.gender==='m'?'selected':''}>남</option><option value="f" ${m.gender==='f'?'selected':''}>여</option>
      </select>
    </div>
    <div style="display:flex;gap:6px">
      <button class="btn btn-gray" style="flex:1" onclick="saveMemberEdit(${m.id})">저장</button>
      <button class="btn btn-red" style="flex:1" onclick="deleteMember(${m.id})">삭제</button>
    </div>
  </div>`).join('');
}
function rerenderAdminMemberList(){
  const val=document.getElementById('memberMgmtSearch').value;
  document.getElementById('memberMgmtList').innerHTML=renderMemberMgmtList();
  const inp=document.getElementById('memberMgmtSearch'); inp.value=val; inp.focus();
}
function addMember(){
  const name=document.getElementById('newMemberName').value.trim();
  const gender=document.getElementById('newMemberGender').value;
  if(!name){ toast('이름을 입력해주세요'); return; }
  const newId = MEMBERS.length ? Math.max(...MEMBERS.map(m=>m.id))+1 : 1;
  MEMBERS_REF.child(newId).set({name, gender});
  document.getElementById('newMemberName').value='';
  toast(`✅ ${name} 회원 추가됨`);
}
function saveMemberEdit(id){
  const name=document.getElementById('mname_'+id).value.trim();
  const gender=document.getElementById('mgender_'+id).value;
  if(!name){ toast('이름을 입력해주세요'); return; }
  MEMBERS_REF.child(id).set({name, gender});
  toast('✅ 저장되었습니다');
}
function deleteMember(id){
  const m=MEMBERS.find(x=>x.id===id); if(!m) return;
  openModal(`⚠️ ${m.name} 회원을 삭제하시겠습니까?\n(오늘 출석중이면 함께 퇴소 처리됩니다)`, ()=>{
    if(attendMap[id]) doLeave(id);
    MEMBERS_REF.child(id).remove();
    toast('삭제되었습니다');
  });
}
function resizeImageForUpload(file, maxSize, cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>maxSize||h>maxSize){ if(w>=h){h=Math.round(h*maxSize/w);w=maxSize;} else {w=Math.round(w*maxSize/h);h=maxSize;} }
      const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',0.72));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function uploadResImg(){
  const input=document.getElementById('resImgInput');
  const file=input.files&&input.files[0];
  if(!file){ toast('이미지를 선택해주세요'); return; }
  resizeImageForUpload(file,1400,dataUrl=>{
    const d=new Date();
    RESIMG_REF.set({dataUrl, month:`${d.getFullYear()}년 ${d.getMonth()+1}월`, uploadedAt:Date.now()});
    toast('✅ 업로드 완료');
  });
}
function showResImgModal(){
  if(!reservationImageInfo || !reservationImageInfo.dataUrl){ toast('아직 등록된 예약표가 없습니다'); return; }
  resImgZoomLevel=1;
  const old=document.getElementById('resImgOv'); if(old) old.remove();
  const ov=document.createElement('div'); ov.id='resImgOv'; ov.className='modal-ov';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:10px';
  ov.innerHTML=`<div style="width:100%;max-width:96vw;max-height:92vh;display:flex;flex-direction:column;background:#fff;border-radius:10px;overflow:hidden">
    <div style="display:flex;gap:6px;padding:8px;background:#F5F4F1;justify-content:center">
      <button class="btn btn-gray" onclick="resImgZoom(-1)">축소 −</button>
      <button class="btn btn-gray" onclick="resImgZoom(1)">확대 +</button>
      <button class="btn btn-red" onclick="document.getElementById('resImgOv').remove()">닫기</button>
    </div>
    <div id="resImgScroll" style="flex:1;overflow:auto;background:#222;touch-action:pan-x pan-y pinch-zoom">
      <img id="resImgPic" src="${reservationImageInfo.dataUrl}" style="display:block;width:100%;transform-origin:0 0;transition:width .15s">
    </div>
  </div>`;
  ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  document.body.appendChild(ov);
}
// 페이지 전체가 user-scalable=no라서 브라우저 기본 핀치줌이 안 먹는다. 예약표만큼은
// 자세히 봐야 하니, 탭으로 배율을 바꿔가며 볼 수 있게 하고(100%→200%→300%→100%),
// 확대된 상태에서는 스크롤로 이동해서 볼 수 있게 한다.
function resImgZoom(dir){
  resImgZoomLevel = Math.max(1, Math.min(4, resImgZoomLevel + dir));
  const img=document.getElementById('resImgPic');
  if(img) img.style.width=(resImgZoomLevel*100)+'%';
}
</script>
