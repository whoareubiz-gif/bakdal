];
const CMAX=4;
const CNAMES={1:'1코트',2:'2코트',3:'3코트',4:'4코트',5:'다음차례1',6:'다음차례2'};
const CCOLORS=['','#1D9E75','#185FA5','#B25000','#7B3FA0','#2E7D9E','#6B7280'];
const CBGS=['','#E1F5EE','#E6F1FB','#FFF0E0','#F3E8FD','#E0F2F7','#F0F0F0'];
const NEXT_COURTS=[5,6];
let CC={1:false,2:false,3:false,4:false,5:false,6:false};
let S={attendees:[],leftMembers:[],seqCounter:0};
let courtActive={1:true,2:true,3:true,4:true};
const boardModeOn=true;

/* 상수 추가 */
const HIDDEN_MEMBER_IDS=[998,999];
const LOGIN_KEY='tennis_login_member';

/* monitor.html은 항상 모니터링 모드 — getCurrentMember는 null 반환 */
function getCurrentMember(){ return null; }

/* 헬퍼 */
function pad(n){return String(n).padStart(2,'0');}
function dateStr(d=new Date()){return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function timeStr(d=new Date()){return`${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function nowTs(){return Math.floor(Date.now()/1000);}
function todayLbl(){const d=new Date(),ds=['일','월','화','수','목','금','토'];return`${d.getMonth()+1}/${d.getDate()}(${ds[d.getDay()]})`;}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function toArr(v){
  if(!v) return [];
  if(Array.isArray(v)) return v;
  return Object.values(v);
}
function leavingMark(isLeaving){
  return isLeaving ? `<span style="font-size:11px;font-weight:900;color:#C0392B;vertical-align:super;margin-left:1px">*</span>` : '';
}
function waitMinutesLabel(a){
  if(a.court) return ''; // 이미 코트에 배정된 인원은 대기시간 표시 안 함
  const baseTs = a.courtFreeTs || a.attendTs || nowTs();
  const mins = Math.max(0, Math.floor((nowTs()-baseTs)/60));
  return `<span style="font-size:9px;color:#888780;font-weight:500;flex-shrink:0;white-space:nowrap">${mins}분</span>`;
}

/* Firebase */
function normalizeS(raw){
  if(!raw) return;
  // 고정 경로(tennis_current) 사용으로 날짜 체크 필요
  // Firebase 데이터의 날짜가 오늘과 다르면 무시 (어제 데이터 오염 방지)
  if(raw.date && raw.date !== dateStr()) return;
  const s = raw.state;
  if(s){
    s.attendees  = toArr(s.attendees).map(a=>({
      ...a,
      court:      a.court      ?? null,
      nextCourt1: a.nextCourt1 ?? null,
      nextCourt2: a.nextCourt2 ?? null,
      hasCourt:   a.hasCourt   ?? false,
    }));
    s.leftMembers = toArr(s.leftMembers);
    S = s;
  }
  if(raw.CC){
    const c = raw.CC;
    CC = {
      1:!!(c['1']||c[1]), 2:!!(c['2']||c[2]),
      3:!!(c['3']||c[3]), 4:!!(c['4']||c[4]),
      5:!!(c['5']||c[5]), 6:!!(c['6']||c[6]),
    };
  }
}
function setSyncDot(st){
  const d=document.getElementById('sync-dot');
  if(d){d.className='sync-dot'+(st?' '+st:'');}
  // 보드모드 sync dot도 같이 갱신 (모니터링 화면에서 연결 상태 확인용)
  const bd=document.getElementById('board-sync-dot');
  if(bd){
    bd.style.background=st==='ok'?'#7FFFB0':st==='err'?'#FF7070':st==='busy'?'#FFD580':'#aaa';
    bd.title='Firebase '+(st==='ok'?'연결됨':st==='err'?'연결 끊김':st==='busy'?'동기화 중':'대기중');
  }
}
function syncListen(){
  // Firebase SDK는 연결이 끊겨도 자동으로 재연결+재구독하므로 단순하게 유지
  REF.on('value', snap=>{
    const raw = snap.val();
    if(!raw){ setSyncDot('err'); return; }
    setSyncDot('ok');
    const incomingToken = raw.seq ?? '';
    if(incomingToken && incomingToken === lastSentToken) return;
    normalizeS(raw);
    renderBoard();
    if(boardModeOn) renderBoard();
  }, err=>{
    setSyncDot('err');
  });
}
function syncCourtActiveFromFirebase(){
  try{
    firebase.database().ref('tennis_court_active').on('value',snap=>{
      const fb=snap.val();
      if(fb){ courtActive=fb; localStorage.setItem(COURT_ACTIVE_KEY, JSON.stringify(fb)); renderBoard(); }
    });
  }catch(e){}
}

/* 보드 렌더링 */
function renderBoard(){
  if(!boardModeOn) return;
  const el=document.getElementById('board-content');
  if(!el) return;
  const me=getCurrentMember();

  function bigSlot(a, conf){
    const isMe=me&&a.id===me.id;
    const ring=isMe?`box-shadow:0 0 0 0.4vw #FFD23F;`:'';
    // conf: true=확정(녹색), false=미확정/빈코트(회색)
    // 확정 시 성별에 따라 파란색/분홍색, 미확정 시 검정색
    const nameTc = conf ? (a.gender==='m' ? '#185FA5' : '#993556') : '#1A1A1A';
    const genderBg = conf ? (a.gender==='m' ? '#E6F1FB' : '#FBEAF0') : 'rgba(0,0,0,0.1)';
    const genderTc = conf ? (a.gender==='m' ? '#185FA5' : '#993556') : '#1A1A1A';
    return`<div style="background:${conf?'rgba(255,255,255,0.92)':'rgba(255,255,255,0.5)'};border-radius:1vw;padding:1.1vw 1.4vw;margin-bottom:0.7vw;display:flex;align-items:center;gap:1vw;${ring}">
      <span style="font-size:2.9vw;font-weight:900;color:${nameTc}">${a.name}</span>
      <span style="font-size:1.3vw;font-weight:700;color:${genderTc};background:${genderBg};padding:0.2vw 0.7vw;border-radius:0.5vw">${a.gender==='m'?'남':'여'}</span>
      ${isMe?`<span style="margin-left:auto;font-size:1.2vw;font-weight:900;color:#B8860B;white-space:nowrap">⭐ 나</span>`:''}
    </div>`;
  }
  function emptySlot(conf){
    const ec = conf ? "rgba(255,255,255,.8)" : "rgba(0,0,0,.4)";
    const eb = conf ? "rgba(255,255,255,.4)" : "rgba(0,0,0,.15)";
    return`<div style="border:0.15vw dashed ${eb};border-radius:1vw;padding:1.1vw 1.4vw;margin-bottom:0.7vw;text-align:center;color:${ec};font-size:1.6vw;font-weight:700">— 빈자리 —</div>`;
  }
  function bigCard(n, isNext){
    if(!isNext && !courtActive[n]){
      return`<div style="background:#C8CDD2;border-radius:1.4vw;padding:2.5vw 1.5vw;min-width:0;height:100%;box-sizing:border-box;box-shadow:0 0.4vw 1.2vw rgba(0,0,0,.1);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:.6">
        <div style="color:#fff;font-size:2.6vw;font-weight:900;margin-bottom:0.5vw">${CNAMES[n]}</div>
        <div style="color:rgba(255,255,255,.8);font-size:1.6vw;font-weight:700">오늘 사용 안 함</div>
      </div>`;
    }
    const ncKey=n===5?'nextCourt1':'nextCourt2';
    const pl=isNext ? S.attendees.filter(x=>x[ncKey]) : S.attendees.filter(x=>x.court===n);
    const cnt=pl.length, conf=!!CC[n];
    let body='';
    if(isNext){
      // 다음차례: 이름 4개를 한 줄 가로 나열 (성별 뱃지 없음)
      const slots = [];
      pl.forEach(a=>{
        const nameTc = conf ? (a.gender==='m'?'#185FA5':'#993556') : '#1A1A1A';
        slots.push(`<div style="flex:1;text-align:center;background:${conf?'rgba(255,255,255,0.92)':'rgba(255,255,255,0.5)'};border-radius:0.8vw;padding:0.9vw 0.5vw;font-size:2.9vw;font-weight:900;color:${nameTc};min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${a.name}</div>`);
      });
      for(let i=cnt;i<CMAX;i++){
        const ec=conf?'rgba(0,0,0,.3)':'rgba(0,0,0,.3)';
        slots.push(`<div style="flex:1;text-align:center;border:0.15vw dashed ${conf?'rgba(255,255,255,.4)':'rgba(0,0,0,.15)'};border-radius:0.8vw;padding:0.9vw 0.5vw;font-size:1.4vw;color:${conf?'rgba(255,255,255,.7)':'rgba(0,0,0,.3)'};font-weight:700">빈자리</div>`);
      }
      body=`<div style="display:flex;gap:0.5vw;align-items:stretch">${slots.join('')}</div>`;
    } else {
      pl.forEach(a=>{ body+=bigSlot(a,conf); });
      for(let i=cnt;i<CMAX;i++) body+=emptySlot(conf);
    }
    const badgeStyle='padding:0.5vw 1.2vw;border-radius:1.5vw;font-size:1.5vw;font-weight:900;white-space:nowrap';
    const statusBadge=conf
      ? `<span style="background:rgba(255,255,255,.3);color:#fff;${badgeStyle}">✅ 게임 확정</span>`
      : cnt>=CMAX
        ? `<span style="background:rgba(0,0,0,.2);color:#fff;${badgeStyle}">🔴 미확정(대기)</span>`
        : `<span style="background:rgba(0,0,0,.15);color:rgba(255,255,255,.9);${badgeStyle};font-weight:800">${cnt}/${CMAX}명 대기</span>`;
    // 확정=녹색, 미확정(대기)·빈코트=중간밝은회색
    const cardBg = conf ? '#1D9E75' : '#9EA8B0';
    const cardTc = '#fff';
    return`<div style="background:${cardBg};border-radius:1.4vw;padding:1.2vw 1.5vw;min-width:0;box-sizing:border-box;box-shadow:0 0.4vw 1.4vw rgba(0,0,0,.18)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1vw;flex-wrap:wrap;gap:0.4vw">
        <span style="color:${cardTc};font-size:2.2vw;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.25)">${CNAMES[n]}</span>
        ${statusBadge}
      </div>
      ${body}
    </div>`;
  }

  // ── 보드 레이아웃 (23인치 1920×1080 기준) ──
  // 고정 높이 없이 내용 크기대로 자연스럽게 배치
  // 1~4코트 → 바로 아래 다음차례1·2 (스크롤로 확인)
  const gap = '0.8vw';

  let h='';
  // 1~4코트: 4열, 높이는 내용(인원)에 맞게 자동
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:${gap};align-items:start;margin-bottom:${gap}">`;
  [1,2,3,4].forEach(n=>{ h+=bigCard(n,false); });
  h+='</div>';
  // 다음차례: 바로 아래 이어서
  h+=`<div style="font-size:2vw;font-weight:900;color:#2C2C2A;margin-bottom:0.8vw">⏭ 다음차례 코트</div>`;
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:${gap};align-items:start;margin-bottom:2vw">`;
  [5,6].forEach(n=>{ h+=bigCard(n,true); });
  h+='</div>';

  el.innerHTML=h;
}

/* 시계 */
function updateBoardClock(){
  const el=document.getElementById('board-clock');
  if(el) el.textContent=timeStr()+' '+todayLbl();
}
setInterval(updateBoardClock,1000);
updateBoardClock();

/* 화면 복귀 시 */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible'){
    REF.once('value', snap=>{
      const raw=snap.val();
      if(!raw) return;
      const incomingToken=raw.seq??'';
      if(incomingToken && incomingToken===lastSentToken) return;
      normalizeS(raw);
      renderBoard();
      if(boardModeOn) renderBoard();
    });
  }
}

/* 연결 상태 */
// Firebase 연결 상태 표시 (sync dot 색상만 업데이트, 리스너 재등록은 하지 않음)
// Firebase SDK가 자체적으로 재연결을 처리하므로 개입하지 않음
firebase.database().ref('.info/connected').on('value', snap=>{
  setSyncDot(snap.val()===true ? 'ok' : 'err');
});

/* 시작 */
syncListen();
syncCourtActiveFromFirebase();
renderBoard();
</script>
